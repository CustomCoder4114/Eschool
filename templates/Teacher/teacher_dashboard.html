{% extends "Teacher/teacher-body.html" %}

{% block allcontent %}
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ======================================================================
   TEACHER DASHBOARD
   Data: GET /api/teacher/dashboard (refreshed every minute) and /api/teacher/todos.
   Scoped to .td with its own light/dark colours (data-no-theme); the main
   colour follows Settings > Appearance through --primary-color.
   ====================================================================== */
.td {
    --td-accent: var(--primary-color, #4361ee);
    --td-accent-2: var(--secondary-color, #7209b7);
    --td-accent-soft: color-mix(in srgb, var(--td-accent) 10%, transparent);
    --td-surface: #ffffff;
    --td-surface-2: #f8fafc;
    --td-hover: #f1f5f9;
    --td-border: #eef1f5;
    --td-line: #e2e8f0;
    --td-text: #0f172a;
    --td-text-2: #334155;
    --td-text-3: #64748b;
    --td-shadow: 0 1px 3px rgba(15, 23, 42, .06);
    --td-ok: #15803d; --td-ok-soft: #dcfce7;
    --td-bad: #dc2626; --td-bad-soft: #fef2f2;
    --td-warn: #b45309; --td-warn-soft: #fef3c7;
    max-width: 1320px; margin: 0 auto; color: var(--td-text);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
body.dark-mode .td {
    --td-accent-soft: color-mix(in srgb, var(--td-accent) 22%, transparent);
    --td-surface: #111827;
    --td-surface-2: #0f172a;
    --td-hover: #1e293b;
    --td-border: #1f2a3b;
    --td-line: #263244;
    --td-text: #e5e7eb;
    --td-text-2: #cbd5e1;
    --td-text-3: #94a3b8;
    --td-shadow: 0 1px 3px rgba(0, 0, 0, .4);
    --td-ok: #4ade80; --td-ok-soft: rgba(34, 197, 94, .15);
    --td-bad: #f87171; --td-bad-soft: rgba(239, 68, 68, .14);
    --td-warn: #fbbf24; --td-warn-soft: rgba(245, 158, 11, .15);
}
.td *, .td *::before, .td *::after { box-sizing: border-box; }
.td button, .td input, .td select, .td textarea { font-family: inherit; }
.td :focus-visible { outline: 3px solid var(--td-accent-soft); outline-offset: 2px; }
.td a { color: inherit; }
.td h1, .td h2 { font-family: 'Poppins', 'Inter', sans-serif; }

/* ---------- hero ---------- */
.td-hero {
    display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
    padding: 24px 28px; margin-bottom: 20px; border-radius: 16px; color: #fff;
    background: linear-gradient(110deg, var(--td-accent), var(--td-accent-2));
}
.td-date { font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.td-hero h1 { margin: 4px 0 6px; font-size: 1.75rem; font-weight: 700; color: #fff; }
.td-hero > div:first-child { flex: 1 1 340px; min-width: 0; }
.td-hero p { margin: 0; opacity: .92; font-size: .95rem; line-height: 1.5; }
.td-stats { display: flex; gap: 12px; flex-wrap: wrap; }
.td-stat { min-width: 112px; padding: 12px 18px; border-radius: 12px; text-align: center; text-decoration: none;
    background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .3); color: #fff !important; transition: background .15s; }
a.td-stat:hover { background: rgba(255, 255, 255, .22); }
.td-stat b { display: block; font: 700 1.35rem 'Poppins', sans-serif; font-variant-numeric: tabular-nums; }
.td-stat b small { font-size: .8rem; font-weight: 600; opacity: .85; }
.td-stat span { font-size: .75rem; opacity: .9; }

/* ---------- cards ---------- */
.td-row { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; margin-bottom: 20px; align-items: stretch; }
.td-card { min-width: 0; padding: 22px 24px; border-radius: 16px; background: var(--td-surface); box-shadow: var(--td-shadow); border: 1px solid var(--td-border); }
.td-card + .td-card, .td-full { margin-bottom: 20px; }
.td-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.td-head h2 { margin: 0; font-size: 1.05rem; font-weight: 700; color: var(--td-text); }
.td-head .td-sub { font-size: .8rem; color: var(--td-text-3); }
.td-link { font-size: .82rem; font-weight: 600; color: var(--td-accent) !important; text-decoration: none; white-space: nowrap; }
.td-link:hover { text-decoration: underline; }
.td-empty { padding: 22px 8px; text-align: center; color: var(--td-text-3); font-size: .88rem; line-height: 1.5; }
.td-skel { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--td-hover), var(--td-surface-2), var(--td-hover)); background-size: 200% 100%; animation: tdSk 1.2s infinite; margin: 12px 0; }
@keyframes tdSk { to { background-position: -200% 0; } }

/* ---------- buttons, fields, notes ---------- */
.td-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid transparent;
    font-weight: 600; font-size: .82rem; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, filter .15s; }
.td-btn.primary { background: var(--td-accent); color: #fff !important; }
.td-btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.td-btn.ghost { background: var(--td-surface) !important; color: var(--td-text) !important; border-color: var(--td-line); }
.td-btn.ghost:hover:not(:disabled) { background: var(--td-hover); }
.td-btn.danger { background: var(--td-surface); color: var(--td-bad) !important; border-color: var(--td-line); }
.td-btn.danger:hover:not(:disabled) { background: var(--td-bad-soft); }
.td-btn:disabled { opacity: .55; cursor: not-allowed; }
.td-input, .td-select { height: 38px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--td-line); background: var(--td-surface); color: var(--td-text); font-size: .88rem; width: 100%; }
.td-textarea { width: 100%; min-height: 70px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--td-line); background: var(--td-surface); color: var(--td-text); font-size: .88rem; resize: vertical; }
.td-input:focus, .td-select:focus, .td-textarea:focus { outline: none; border-color: var(--td-accent); box-shadow: 0 0 0 3px var(--td-accent-soft); }
.td-input::placeholder, .td-textarea::placeholder { color: var(--td-text-3); }
.td-note { display: none; margin-top: 8px; padding: 9px 12px; border-radius: 8px; font-size: .84rem; background: var(--td-accent-soft); color: var(--td-text); }
.td-note.show { display: block; }
.td-note.ok { background: var(--td-ok-soft); color: var(--td-ok); }
.td-note.bad { background: var(--td-bad-soft); color: var(--td-bad); }
#tdFlash { margin: -6px 0 20px; }

/* ---------- list rows (to do, coming up) ---------- */
.td-item { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-top: 1px solid var(--td-border); }
.td-list > .td-item:first-child, .td-list > .td-wrap:first-child > .td-item { border-top: 0; }
.td-ic { width: 36px; height: 36px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: .9rem; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.td-txt { flex: 1; min-width: 0; }
.td-txt b { display: block; font-weight: 600; font-size: .92rem; color: var(--td-text); overflow-wrap: anywhere; }
.td-txt span { display: block; font-size: .82rem; color: var(--td-text-3); margin-top: 1px; line-height: 1.45; }
.td-acts { display: flex; gap: 6px; flex: none; }
.td-form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 0 14px 50px; }
.td-form:empty { display: none; }
.td-form label { display: flex; flex-direction: column; gap: 4px; font-size: .76rem; font-weight: 600; color: var(--td-text-2); }
.td-form .wide { grid-column: 1 / -1; }
.td-form .td-hint { grid-column: 1 / -1; margin: 0; font-size: .78rem; color: var(--td-text-3); }
.td-quote { grid-column: 1 / -1; padding: 8px 12px; border-left: 3px solid var(--td-accent); background: var(--td-surface-2); border-radius: 0 8px 8px 0; font-size: .84rem; color: var(--td-text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.td-wrap .td-note { margin: 0 0 12px 50px; }

/* my tasks */
.td-lab { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 2px; font-size: .7rem; font-weight: 700; letter-spacing: .08em; color: var(--td-text-3); }
.td-lab button { border: 0; background: none; color: var(--td-text-3); font-size: .75rem; letter-spacing: 0; font-weight: 600; cursor: pointer; text-decoration: underline; }
.td-todo { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--td-border); }
.td-todo input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--td-accent); flex: none; cursor: pointer; }
.td-todo span:not(.td-due) { flex: 1; min-width: 0; font-size: .9rem; overflow-wrap: anywhere; }
.td-todo.done span:not(.td-due) { text-decoration: line-through; color: var(--td-text-3); }
.td-due { font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--td-hover); color: var(--td-text-2); white-space: nowrap; }
.td-due.late { background: var(--td-bad-soft); color: var(--td-bad); }
.td-due.today { background: var(--td-warn-soft); color: var(--td-warn); }
.td-x { border: 0; background: none; color: var(--td-text-3); cursor: pointer; width: 28px; height: 28px; border-radius: 8px; flex: none; opacity: .6; }
.td-todo:hover .td-x { opacity: 1; }
.td-x:hover { background: var(--td-bad-soft); color: var(--td-bad); }
.td-add { display: grid; grid-template-columns: minmax(0, 1fr) 150px auto; gap: 8px; margin-top: 10px; }

/* coming up */
.td-cal { width: 50px; flex: none; text-align: center; border-radius: 10px; padding: 6px 0; background: var(--td-accent-soft); }
.td-cal b { display: block; font: 700 1.1rem/1.1 'Poppins', sans-serif; color: var(--td-accent); }
.td-cal span { font-size: .68rem; font-weight: 600; text-transform: uppercase; color: var(--td-text-3); }
.td-pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-weight: 600; white-space: nowrap; background: var(--td-hover); color: var(--td-text-2); }
.td-pill.lesson { background: var(--td-ok-soft); color: var(--td-ok); }
.td-pill.live { background: var(--td-bad-soft); color: var(--td-bad); }
.td-pill.now { background: #ef4444; color: #fff; }
.td-pill.warn { background: var(--td-warn-soft); color: var(--td-warn); }
.td-foot { padding-top: 12px; text-align: center; font-size: .84rem; color: var(--td-text-3); }

/* ---------- learners ---------- */
.td-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.td-table th { text-align: left; font-size: .75rem; font-weight: 600; color: var(--td-text-3); padding: 0 10px 8px 0; }
.td-table td { padding: 12px 10px 12px 0; border-top: 1px solid var(--td-border); vertical-align: middle; }
.td-table td:last-child { text-align: right; padding-right: 0; }
.td-who { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.td-who small { display: none; font-weight: 400; font-size: .78rem; color: var(--td-text-3); }
.td-av { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; flex: none; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: .78rem; background: var(--c, var(--td-accent)); }
.td-av img { width: 100%; height: 100%; object-fit: cover; }
.td-muted { color: var(--td-text-3); }

/* ---------- earnings ---------- */
.td-big { font: 700 1.9rem/1.1 'Poppins', sans-serif; color: var(--td-text); font-variant-numeric: tabular-nums; }
.td-big small { font: 400 .82rem 'Inter', sans-serif; color: var(--td-text-3); }
.td-bars { display: flex; align-items: flex-end; gap: 12px; height: 120px; margin: 18px 0 6px; }
.td-bars div { flex: 1; height: 100%; display: flex; align-items: flex-end; }
.td-bars i { display: block; width: 100%; min-height: 3px; border-radius: 6px 6px 0 0; background: color-mix(in srgb, var(--td-accent) 30%, transparent); }
.td-bars div.cur i { background: var(--td-accent); }
.td-blab { display: flex; gap: 12px; }
.td-blab span { flex: 1; text-align: center; font-size: .74rem; color: var(--td-text-3); }
.td-split { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--td-border); }
.td-split div { font-size: .78rem; color: var(--td-text-3); }
.td-split b { display: block; margin-top: 2px; font: 600 1rem 'Poppins', sans-serif; color: var(--td-text); }

/* ---------- ratings ---------- */
.td-score { display: flex; align-items: center; gap: 16px; }
.td-score .td-big small { font-size: .9rem; }
.td-score p { margin: 0; font-size: .82rem; color: var(--td-text-3); line-height: 1.5; }
.td-rev { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--td-surface-2); }
.td-rev-top { display: flex; justify-content: space-between; gap: 8px; font-size: .88rem; }
.td-rev p { margin: 4px 0 0; font-size: .84rem; color: var(--td-text-2); line-height: 1.5; overflow-wrap: anywhere; }
.td-rev time { font-size: .75rem; color: var(--td-text-3); }
.td-stars { color: #f59e0b; letter-spacing: 1px; white-space: nowrap; }
.td-stars .off { color: var(--td-line); }

/* ---------- small screens ---------- */
@media (max-width: 1000px) { .td-row { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) {
    .td-hero { padding: 18px; }
    .td-hero h1 { font-size: 1.35rem; }
    .td-stats { width: 100%; }
    .td-stat { flex: 1; min-width: 0; padding: 10px 8px; }
    .td-stat b { font-size: 1.1rem; }
    .td-card { padding: 18px 16px; }
    .td-item { flex-wrap: wrap; }
    .td-acts { width: 100%; padding-left: 50px; }
    .td-form { grid-template-columns: minmax(0, 1fr); padding-left: 0; }
    .td-wrap .td-note { margin-left: 0; }
    .td-add { grid-template-columns: minmax(0, 1fr) auto; }
    .td-add input[type="date"] { grid-column: 1 / -1; grid-row: 2; }
    .td-table .hide-sm { display: none; }
    .td-who small { display: block; }
}
@media (prefers-reduced-motion: reduce) { .td *, .td *::before, .td *::after { animation: none !important; transition: none !important; } }
</style>

<div class="td" data-no-theme>
    <header class="td-hero">
        <div>
            <div class="td-date" id="tdDate"></div>
            <h1 id="tdGreet" data-first="{{ firstname or '' }}">Hello, {{ firstname }}</h1>
            <p id="tdSummary">Loading your day…</p>
        </div>
        <div class="td-stats">
            <a class="td-stat" href="/teacher-settings#earnings"><b id="tdStEarn">–</b><span>Earned this month</span></a>
            <a class="td-stat" href="#tdLearners"><b id="tdStLearners">–</b><span>Learners</span></a>
            <a class="td-stat" href="#tdRatingsCard"><b id="tdStScore">–</b><span>Eschool score</span></a>
        </div>
    </header>

    <div class="td-row">
        <section class="td-card" aria-labelledby="tdTodoH">
            <div class="td-head"><h2 id="tdTodoH">To do</h2><span class="td-sub" id="tdTodoSub"></span></div>
            <div class="td-list" id="tdJobs"><div class="td-skel"></div><div class="td-skel" style="width:70%"></div></div>
            <div class="td-lab"><span>MY TASKS</span><button type="button" id="tdTodoClear" hidden>Clear finished</button></div>
            <div id="tdTodos"></div>
            <form class="td-add" id="tdTodoForm" autocomplete="off">
                <input class="td-input" id="tdTodoText" maxlength="160" placeholder="Add a task…" aria-label="New task">
                <input class="td-input" type="date" id="tdTodoDue" aria-label="Due date (optional)">
                <button class="td-btn primary" type="submit">Add</button>
            </form>
            <div class="td-note" id="tdTodoNote" role="status"></div>
        </section>

        <section class="td-card" aria-labelledby="tdUpH">
            <div class="td-head"><h2 id="tdUpH">Coming up</h2><a class="td-link" href="/teacher-schedule">Open schedule →</a></div>
            <div class="td-list" id="tdUp"><div class="td-skel"></div><div class="td-skel" style="width:60%"></div></div>
        </section>
    </div>

    <span id="tdPrivate"></span>
    <section class="td-card td-full" id="tdLearners" aria-labelledby="tdLearnH">
        <div class="td-head"><h2 id="tdLearnH">My learners</h2><a class="td-link" href="/teacher-parent">Lesson requests →</a></div>
        <div id="tdLearn"><div class="td-skel"></div></div>
    </section>

    <div class="td-row">
        <section class="td-card" aria-labelledby="tdEarnH">
            <div class="td-head"><h2 id="tdEarnH">Earnings</h2><a class="td-link" href="/teacher-settings#earnings">Payouts →</a></div>
            <div id="tdEarn"><div class="td-skel"></div></div>
        </section>

        <section class="td-card" id="tdRatingsCard" aria-labelledby="tdRateH">
            <div class="td-head"><h2 id="tdRateH">Ratings</h2><a class="td-link" href="/teacher-profile">See all →</a></div>
            <div id="tdRate"><div class="td-skel"></div></div>
        </section>
    </div>
</div>

<script>
(function () {
    'use strict';
    const $ = id => document.getElementById(id);
    const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = n => Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
    const money = n => '{{ CURRENCY }} ' + fmt(n);
    const TZ = 'Africa/Nairobi';
    const FIRST = ($('tdGreet').dataset.first || '').trim();
    let D = null;

    /* ---------- time ---------- */
    const hm = d => new Date(d).toLocaleTimeString('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
    const dayName = (d, o) => new Date(d).toLocaleDateString('en-GB', Object.assign({ timeZone: TZ }, o));
    const dayKey = d => new Date(d).toLocaleDateString('en-CA', { timeZone: TZ });
    function ago(iso) {
        const d = new Date(iso); if (!iso || isNaN(d)) return '';
        const s = (Date.now() - d) / 1000;
        if (s < 3600) return Math.max(1, Math.floor(s / 60)) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago';
        const days = Math.floor(s / 86400); if (days === 1) return 'yesterday'; if (days < 7) return days + ' days ago';
        return dayName(d, { day: 'numeric', month: 'short' });
    }
    function header() {
        const n = new Date(), h = Number(n.toLocaleString('en-GB', { timeZone: TZ, hour: '2-digit', hour12: false }));
        $('tdDate').textContent = dayName(n, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        const hello = h >= 5 && h < 12 ? 'Good morning' : h >= 12 && h < 17 ? 'Good afternoon' : h >= 17 && h < 22 ? 'Good evening' : 'Hello';
        $('tdGreet').textContent = FIRST ? `${hello}, ${FIRST}` : hello;
    }
    header(); setInterval(header, 60000);

    async function api(url, method, body) {
        const r = await fetch(url, { method: method || 'GET', credentials: 'same-origin', cache: 'no-store',
            headers: body ? { 'Content-Type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined });
        if (r.status === 401) { location.href = '/Login'; throw new Error('Please sign in again.'); }
        let d = null; try { d = await r.json(); } catch (e) { /* none */ }
        if (!r.ok || (d && d.success === false)) throw new Error((d && d.message) || `Something went wrong (${r.status}).`);
        return d || {};
    }
    function note(el, text, kind) {
        if (typeof el === 'string') el = $(el);
        if (!el) return;
        el.className = 'td-note' + (text ? ' show ' + (kind || '') : '');
        el.textContent = text || '';
        clearTimeout(el._t); if (text && kind !== 'bad') el._t = setTimeout(() => note(el, ''), 6000);
    }
    function flash(text) {
        let el = $('tdFlash');
        if (!el) { el = document.createElement('div'); el.id = 'tdFlash'; document.querySelector('.td-hero').after(el); }
        note(el, text, 'ok');
    }
    const COLORS = ['#0ea5e9', '#8b5cf6', '#10b981', '#f59e0b', '#ec4899', '#6366f1'];
    function avatar(p) {
        const name = (p && p.name) || '?', init = name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
        const c = COLORS[((p && p.id) || name.length) % COLORS.length];
        return p && p.avatar_url
            ? `<span class="td-av" style="--c:${c}"><img src="${esc(p.avatar_url)}" alt="" loading="lazy" onerror="this.parentNode.textContent='${esc(init)}'"></span>`
            : `<span class="td-av" style="--c:${c}">${esc(init)}</span>`;
    }
    const stars = n => [0, 1, 2, 3, 4].map(i => `<span class="${i < Math.round(n || 0) ? '' : 'off'}">★</span>`).join('');
    const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;
    const nextLessonFor = id => (D.upcoming || []).find(x => x.type === 'lesson' && x.tutoring_id === id && !['completed', 'missed'].includes(x.status));

    /* ---------- hero ---------- */
    function renderHero() {
        const k = D.kpis, now = Date.now();
        $('tdStEarn').textContent = money(k.earned.month);
        $('tdStLearners').textContent = fmt(k.learners.value);
        $('tdStScore').innerHTML = D.score && D.score.score != null ? `${D.score.score}<small>/10</small>` : '–';
        const left = D.todays.filter(x => new Date(x.start).getTime() + x.minutes * 60000 > now && !['completed', 'missed'].includes(x.status));
        const next = (D.upcoming || []).find(x => new Date(x.start).getTime() + x.minutes * 60000 > now);
        const what = x => x.type === 'live' ? `the live class "${x.title}"` : x.type === 'lesson' ? `${x.subject} with ${x.student}` : x.title;
        let line;
        if (left.length) line = `${plural(left.length, 'thing')} left today. Next: ${what(left[0])} at ${hm(left[0].start)}.`;
        else if (next) line = `Nothing left today. Your next one is ${what(next)} on ${dayName(next.start, { weekday: 'long', day: 'numeric', month: 'short' })} at ${hm(next.start)}.`;
        else line = 'Nothing is booked yet.';
        $('tdSummary').textContent = line;
    }

    /* ---------- to do: jobs from Eschool + my own tasks ---------- */
    function jobs() {
        const t = D.tutoring, k = D.kpis, out = [];
        t.pending.forEach(r => out.push({ key: 'req-' + r.id, c: '#10b981', i: 'fa-hand', title: `Lesson request: ${r.subject} for ${r.child.name}`,
            text: `${r.self_paid ? 'The learner is asking and will pay' : 'From ' + r.parent.name} · ${plural(r.sessions_per_week, 'lesson')} a week · ${r.mode_label}`,
            acts: `<button type="button" class="td-btn primary" data-req-open="${r.id}">Accept…</button><button type="button" class="td-btn danger" data-req-decline="${r.id}">Decline</button>` }));
        (D.attention || []).filter(a => a.icon === 'fa-video').forEach((a, n) => out.push({ key: 'live-' + n, c: '#ef4444', i: 'fa-video', title: a.title,
            text: `${a.text}${a.start ? ' · starts ' + hm(a.start) : ''}`, acts: `<a class="td-btn primary" href="${esc(a.href)}">Open studio</a>` }));
        t.engagements.filter(r => r.status === 'active' && r.sessions_left > 0).forEach(r => out.push({ key: 'book-' + r.id, c: '#0284c7', i: 'fa-calendar-plus',
            title: `Book ${plural(r.sessions_left, `paid ${r.subject} lesson`)} for ${r.child.name}`,
            text: 'Already paid. Pick the dates so you can teach and get paid.', acts: `<button type="button" class="td-btn primary" data-book-open="${r.id}">Book</button>` }));
        t.to_record.forEach(l => out.push({ key: 'rec-' + l.id, c: '#d97706', i: 'fa-clipboard-check', title: `Add notes: ${l.subject} with ${l.student}`,
            text: `${dayName(l.start, { weekday: 'short', day: 'numeric', month: 'short' })} · ${l.outcome_label || ''}`,
            acts: `<button type="button" class="td-btn ghost" data-rec-open="${l.id}">Add notes</button>` }));
        if (k.unread.value) out.push({ key: 'msg', c: '#4361ee', i: 'fa-envelope', title: plural(k.unread.value, 'unread message'),
            text: `From ${plural(k.unread.people, 'person', 'people')}`, acts: '<a class="td-btn ghost" href="/teacher-messages">Open</a>' });
        return out;
    }
    function renderJobs() {
        const list = jobs();
        $('tdTodoSub').textContent = list.length ? `${list.length} from Eschool` : '';
        $('tdJobs').innerHTML = list.length ? list.map(j => `<div class="td-wrap" data-key="${j.key}">
                <div class="td-item"><span class="td-ic" style="--c:${j.c}"><i class="fas ${j.i}"></i></span>
                <div class="td-txt"><b>${esc(j.title)}</b><span>${esc(j.text)}</span></div><div class="td-acts">${j.acts}</div></div>
                <div class="td-form" id="form-${j.key}"></div><div class="td-note" id="note-${j.key}"></div></div>`).join('')
            : '<div class="td-empty" style="padding:12px 0 4px">You are all caught up.</div>';
    }

    let todos = [];
    function renderTodos() {
        const today = D ? D.today : dayKey(Date.now());
        $('tdTodos').innerHTML = todos.map(t => {
            let due = '';
            if (t.due) {
                const cls = !t.done && t.due < today ? 'late' : t.due === today ? 'today' : '';
                due = `<span class="td-due ${cls}">${cls === 'late' ? 'Late · ' : ''}${t.due === today ? 'Today' : new Date(t.due + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}</span>`;
            }
            return `<div class="td-todo ${t.done ? 'done' : ''}"><input type="checkbox" data-tdone="${t.id}" ${t.done ? 'checked' : ''} aria-label="Done: ${esc(t.text)}"><span>${esc(t.text)}</span>${due}<button type="button" class="td-x" data-tdel="${t.id}" aria-label="Delete task"><i class="fas fa-xmark"></i></button></div>`;
        }).join('');
        $('tdTodoClear').hidden = !todos.some(t => t.done);
    }
    $('tdTodoForm').addEventListener('submit', async e => {
        e.preventDefault();
        const text = $('tdTodoText').value.trim();
        if (!text) { $('tdTodoText').focus(); return; }
        try { todos = (await api('/api/teacher/todos', 'POST', { text, due: $('tdTodoDue').value || null })).todos; $('tdTodoText').value = ''; $('tdTodoDue').value = ''; renderTodos(); }
        catch (err) { note('tdTodoNote', err.message, 'bad'); }
    });
    $('tdTodos').addEventListener('change', async e => {
        const c = e.target.closest('[data-tdone]'); if (!c) return;
        try { todos = (await api('/api/teacher/todos/' + c.dataset.tdone, 'PATCH', { done: c.checked })).todos; renderTodos(); }
        catch (err) { c.checked = !c.checked; note('tdTodoNote', err.message, 'bad'); }
    });
    $('tdTodos').addEventListener('click', async e => {
        const b = e.target.closest('[data-tdel]'); if (!b) return;
        try { todos = (await api('/api/teacher/todos/' + b.dataset.tdel, 'DELETE')).todos; renderTodos(); } catch (err) { note('tdTodoNote', err.message, 'bad'); }
    });
    $('tdTodoClear').addEventListener('click', async () => {
        try { todos = (await api('/api/teacher/todos/0', 'DELETE')).todos; renderTodos(); } catch (err) { note('tdTodoNote', err.message, 'bad'); }
    });

    /* ---------- coming up ---------- */
    function renderUpcoming() {
        const now = Date.now();
        const items = (D.upcoming || []).filter(x => !['completed', 'missed'].includes(x.status)).slice(0, 5);
        const rows = items.map(x => {
            const st = new Date(x.start).getTime(), live = st <= now && now < st + x.minutes * 60000;
            const pill = live ? '<span class="td-pill now">Now</span>'
                : x.type === 'live' ? '<span class="td-pill live">Live class</span>'
                : x.type === 'lesson' ? '<span class="td-pill lesson">Lesson</span>'
                : `<span class="td-pill">${esc(x.kind_label || 'Event')}</span>`;
            const inside = /^\/(?!\/)/.test(x.link || '');
            const act = live && x.link ? `<a class="td-btn primary" href="${esc(x.link)}" ${inside ? '' : 'target="_blank" rel="noopener"'}>${x.type === 'live' ? 'Open studio' : 'Join'}</a>` : pill;
            const title = x.type === 'lesson' ? `${x.subject}${x.topic ? ' · ' + x.topic : ''}` : x.title;
            const who = x.type === 'lesson' ? x.student : x.type === 'live' ? [x.grade, plural(x.reminders || 0, 'reminder')].filter(Boolean).join(' · ') : (x.location || '');
            return `<div class="td-item"><div class="td-cal"><b>${dayName(x.start, { day: 'numeric' })}</b><span>${dayName(x.start, { month: 'short' })}</span></div>
                <div class="td-txt"><b>${esc(title)}</b><span>${dayKey(x.start) === D.today ? 'Today' : dayName(x.start, { weekday: 'short' })} ${hm(x.start)} · ${x.minutes} min${who ? ' · ' + esc(who) : ''}</span></div>${act}</div>`;
        }).join('');
        const noLive = !items.some(x => x.type === 'live');
        $('tdUp').innerHTML = (rows || '<div class="td-empty">Nothing booked yet.</div>')
            + (noLive ? '<div class="td-foot">No live classes planned. <a class="td-link" href="/teacher-live">Create one</a></div>' : '');
    }

    /* ---------- my learners ---------- */
    function renderLearners() {
        const t = D.tutoring, rows = t.engagements;
        if (!rows.length) {
            $('tdLearn').innerHTML = `<div class="td-empty">No learners yet. When a family hires you, they show up here.${t.profile && t.profile.exists ? '' : ' <a class="td-link" href="/teacher-settings#teaching">Set up your teaching profile</a> so families can find you.'}</div>`;
            return;
        }
        $('tdLearn').innerHTML = `<table class="td-table"><thead><tr><th>Learner</th><th class="hide-sm">Subject</th><th>Lessons</th><th class="hide-sm">Next lesson</th><th class="hide-sm">Paid by</th><th></th></tr></thead><tbody>` +
            rows.map(r => {
                const nx = nextLessonFor(r.id);
                const lessons = r.status === 'accepted' ? '<span class="td-pill warn">Waiting for payment</span>'
                    : `${r.sessions_used} taught · <b>${r.sessions_left ? r.sessions_left + ' to book' : r.sessions_booked ? r.sessions_booked + ' booked' : 'all used'}</b>`;
                const next = nx ? `${dayName(nx.start, { weekday: 'short', day: 'numeric', month: 'short' })}, ${hm(nx.start)}`
                    : r.status === 'active' && r.sessions_left ? '<span class="td-pill warn">Not booked</span>' : '<span class="td-muted">—</span>';
                const act = r.status === 'active' && r.sessions_left ? `<button type="button" class="td-btn primary" data-book-open="${r.id}">Book</button>` : '';
                return `<tr><td><div class="td-who">${avatar(r.child)}<div>${esc(r.child.name)}<small>${esc(r.subject)}</small></div></div></td><td class="hide-sm">${esc(r.subject)}</td><td>${lessons}</td>
                    <td class="hide-sm">${next}</td><td class="hide-sm td-muted">${r.self_paid ? 'The learner' : esc(r.parent.name)}</td><td>${act}</td></tr>`;
            }).join('') + '</tbody></table>';
    }

    /* ---------- earnings ---------- */
    function renderEarnings() {
        const k = D.kpis, m = D.months || [], max = Math.max(1, ...m.map(x => x.amount));
        $('tdEarn').innerHTML = `<div class="td-big">${money(k.earned.month)} <small>this month</small></div>
            <div class="td-bars" role="img" aria-label="Earnings for the last 6 months">${m.map((x, i) => `<div class="${i === m.length - 1 ? 'cur' : ''}" title="${money(x.amount)}"><i style="height:${Math.max(2, x.amount / max * 100)}%"></i></div>`).join('')}</div>
            <div class="td-blab">${m.map(x => `<span>${new Date(x.month + '-15T12:00:00').toLocaleDateString('en-US', { month: 'short' })}</span>`).join('')}</div>
            <div class="td-split"><div>All time<b>${money(k.earned.total)}</b></div><div>Lessons taught this month<b>${fmt(k.lessons.month)}</b></div>
            ${k.pending.value ? `<div>Being checked by Eschool<b>${money(k.pending.value)}</b></div>` : ''}</div>`;
    }

    /* ---------- ratings ---------- */
    function renderRatings() {
        const sc = D.score, r = D.ratings;
        const top = sc && sc.score != null ? `<div class="td-score"><div class="td-big">${sc.score}<small>/10</small></div>
            <p>Your Eschool score: what families see.<br>${esc((sc.score_reasons || []).join(' · '))}</p></div>` : '';
        const revs = r.latest.slice(0, 2).map(v => `<div class="td-rev"><div class="td-rev-top"><b>${esc(v.name)}</b><span class="td-stars">${stars(v.stars)}</span></div>
            ${v.comment ? `<p>“${esc(v.comment)}”</p>` : ''}<time>${ago(v.at)}</time></div>`).join('');
        $('tdRate').innerHTML = top + (revs || '<div class="td-empty">No reviews yet. Families you teach can rate you after a lesson.</div>');
    }

    /* ---------- forms inside the to-do list ---------- */
    function openForm(key) {
        const box = $('form-' + key);
        if (!box) return null;
        if (box.innerHTML) { box.innerHTML = ''; return null; }
        document.querySelectorAll('.td-form').forEach(f => { if (f !== box) f.innerHTML = ''; });
        return box;
    }
    document.querySelector('.td').addEventListener('click', async e => {
        let b;
        if ((b = e.target.closest('[data-req-open]'))) {
            const id = +b.dataset.reqOpen, box = openForm('req-' + id); if (!box) return;
            const t = D.tutoring.pending.find(x => x.id === id) || {};
            box.innerHTML = `<div class="td-quote">${esc(t.message || 'No message.')}${t.goals ? '\nGoals: ' + esc(t.goals) : ''}${t.preferred_times ? '\nPreferred times: ' + esc(t.preferred_times) : ''}</div>
                <label>Price per lesson ({{ CURRENCY }})<input class="td-input" type="number" min="{{ LESSON_MIN }}" max="{{ LESSON_MAX }}" step="{{ LESSON_STEP }}" value="${Number(t.rate || (D.tutoring.profile && D.tutoring.profile.rate) || {{ LESSON_MIN }})}" data-f="rate"></label>
                <label>Lesson length<select class="td-select" data-f="minutes">${[30, 45, 60, 90, 120].map(m => `<option value="${m}" ${m === (t.session_minutes || 60) ? 'selected' : ''}>${m} minutes</option>`).join('')}</select></label>
                <label>&nbsp;<button type="button" class="td-btn primary" data-req-accept="${id}">Accept request</button></label>
                <label class="wide">Note to the family (optional)<input class="td-input" maxlength="400" data-f="note" placeholder="e.g. I can start next Monday at 4 pm."></label>`;
            box.querySelector('[data-f="rate"]').focus();
            return;
        }
        if ((b = e.target.closest('[data-req-accept]'))) {
            const id = +b.dataset.reqAccept, box = $('form-req-' + id), f = s => box.querySelector(`[data-f="${s}"]`).value;
            b.disabled = true;
            try { await api(`/api/tutoring/${id}/respond`, 'POST', { action: 'accept', rate: +f('rate'), session_minutes: +f('minutes'), note: f('note') }); flash('Request accepted. They have been told the price and can now pay for lessons.'); await load(); }
            catch (err) { b.disabled = false; note('note-req-' + id, err.message, 'bad'); }
            return;
        }
        if ((b = e.target.closest('[data-req-decline]'))) {
            if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Tap again to decline'; return; }
            b.disabled = true;
            try { await api(`/api/tutoring/${b.dataset.reqDecline}/respond`, 'POST', { action: 'decline' }); flash('Request declined. They have been told.'); await load(); }
            catch (err) { b.disabled = false; note('note-req-' + b.dataset.reqDecline, err.message, 'bad'); }
            return;
        }
        if ((b = e.target.closest('[data-book-open]'))) {
            const id = +b.dataset.bookOpen, key = 'book-' + id;
            const inTable = !!b.closest('.td-table');
            const box = $('form-' + key);
            if (inTable && box && box.innerHTML) { box.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
            if (!openForm(key)) return;
            const r = D.tutoring.engagements.find(x => x.id === id) || {};
            const d = new Date(Date.now() + 86400000); d.setMinutes(0, 0, 0);
            const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
            box.innerHTML = `<label>Date and time<input class="td-input" type="datetime-local" data-b="when" value="${local}"></label>
                <label>Length<select class="td-select" data-b="min">${[30, 45, 60, 90, 120].map(m => `<option ${m === (r.session_minutes || 60) ? 'selected' : ''} value="${m}">${m} minutes</option>`).join('')}</select></label>
                <label>&nbsp;<button type="button" class="td-btn primary" data-book="${id}">Book lesson</button></label>
                <label class="wide">Topic (optional)<input class="td-input" maxlength="160" data-b="topic" placeholder="e.g. Acids and bases"></label>
                <p class="td-hint">Online lessons happen in an Eschool call: call the learner from Messages at lesson time.</p>`;
            if (inTable) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }
        if ((b = e.target.closest('[data-book]'))) {
            const id = +b.dataset.book, box = $('form-book-' + id), v = s => box.querySelector(`[data-b="${s}"]`).value;
            if (!v('when')) { note('note-book-' + id, 'Choose the date and time.', 'bad'); return; }
            b.disabled = true;
            try {
                await api(`/api/tutoring/${id}/sessions`, 'POST', { starts_at: new Date(v('when')).toISOString(), minutes: +v('min'), topic: v('topic') });
                flash('Lesson booked. The learner and the family have been told.'); await load();
            } catch (err) { b.disabled = false; note('note-book-' + id, err.message, 'bad'); }
            return;
        }
        if ((b = e.target.closest('[data-rec-open]'))) {
            const id = +b.dataset.recOpen, box = openForm('rec-' + id); if (!box) return;
            box.innerHTML = `<label class="wide">What you covered (the learner and the family can read this)<textarea class="td-textarea" maxlength="1000" data-r="notes" placeholder="What you covered and how the learner did"></textarea></label>
                <label class="wide">Homework (optional)<input class="td-input" maxlength="400" data-r="hw" placeholder="e.g. Exercise 4B, questions 1 to 10"></label>
                <label>&nbsp;<button type="button" class="td-btn primary" data-record="${id}">Save notes</button></label>
                <p class="td-hint">Eschool already knows the lesson happened from the call. Just write what you covered.</p>`;
            box.querySelector('textarea').focus();
            return;
        }
        if ((b = e.target.closest('[data-record]'))) {
            const id = +b.dataset.record, box = $('form-rec-' + id), q = s => box.querySelector(`[data-r="${s}"]`);
            if (!q('notes').value.trim()) { note('note-rec-' + id, 'Write what you covered first.', 'bad'); return; }
            b.disabled = true;
            try { await api(`/api/tutoring/sessions/${id}`, 'PATCH', { teacher_notes: q('notes').value, homework: q('hw').value }); flash('Lesson notes saved. The learner and the family can read them now.'); await load(); }
            catch (err) { b.disabled = false; note('note-rec-' + id, err.message, 'bad'); }
        }
    });

    /* ---------- load ---------- */
    async function load() {
        try { D = await api('/api/teacher/dashboard'); }
        catch (err) { $('tdSummary').textContent = "Couldn't load your dashboard: " + err.message; return; }
        todos = D.todos || [];
        renderHero(); renderJobs(); renderTodos(); renderUpcoming(); renderLearners(); renderEarnings(); renderRatings();
    }
    load();
    // keep it current, but never while something is being typed or a form is open
    setInterval(() => {
        if (document.hidden) return;
        const a = document.activeElement;
        if (a && a.closest && a.closest('.td') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
        if (document.querySelector('.td .td-form:not(:empty)')) return;
        load();
    }, 60000);
})();
</script>
{% endblock %}
