{% extends "Learner/body.html" %}

{% block allcontent %}
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* older phones (no color-mix): plain soft colours so nothing disappears */
@supports not (color: color-mix(in srgb, red 50%, blue)) {
    .sc { --sc-accent-soft: rgba(67, 97, 238, .11); --sc-accent-line: rgba(67, 97, 238, .35); }
    .sc-ev, .sc-chip.k, .sc-arow .bar { background-color: rgba(67, 97, 238, .12); }
}
/* ======================================================================
   LEARNER SCHEDULE AND GOALS
   Saved on the server (not in the browser), so it is the same on every
   device. The same API as teachers, answered for the signed-in learner:
     GET  /api/teacher/schedule?from&to     your events + lessons with teachers + live classes you follow + marked days
     POST /api/teacher/events               PATCH/DELETE /api/teacher/events/<id>
     POST /api/teacher/events/<id>/status   done / missed for one day
     POST /api/teacher/marks                DELETE /api/teacher/marks/<id>
   All times are Nairobi time. Scoped to .sc with its own light/dark
   colours (data-no-theme); the main colour follows Settings > Appearance.
   No pop-ups: messages are shown on the page.
   ====================================================================== */
.sc {
    --sc-accent: var(--primary-color, #4361ee);
    --sc-accent-2: var(--secondary-color, #7209b7);
    --sc-accent-soft: color-mix(in srgb, var(--sc-accent) 11%, transparent);
    --sc-accent-line: color-mix(in srgb, var(--sc-accent) 35%, transparent);
    --sc-surface: #ffffff;
    --sc-surface-2: #f8fafc;
    --sc-hover: #f1f5f9;
    --sc-border: #e5e7eb;
    --sc-grid: #eef0f4;
    --sc-text: #0f172a;
    --sc-text-2: #475569;
    --sc-text-3: #64748b;
    --sc-shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 6px 18px rgba(15, 23, 42, .06);
    --sc-ok: #059669; --sc-ok-soft: #ecfdf5;
    --sc-bad: #dc2626; --sc-bad-soft: #fef2f2;
    --sc-warn: #b45309; --sc-warn-soft: #fffbeb;
    --sc-hour: 52px;
    max-width: 1400px; margin: 0 auto; color: var(--sc-text);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
body.dark-mode .sc {
    --sc-accent-soft: color-mix(in srgb, var(--sc-accent) 22%, transparent);
    --sc-accent-line: color-mix(in srgb, var(--sc-accent) 50%, transparent);
    --sc-surface: #111827;
    --sc-surface-2: #0f172a;
    --sc-hover: #1e293b;
    --sc-border: #263244;
    --sc-grid: #1c2636;
    --sc-text: #e5e7eb;
    --sc-text-2: #cbd5e1;
    --sc-text-3: #94a3b8;
    --sc-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
    --sc-ok: #34d399; --sc-ok-soft: rgba(16, 185, 129, .14);
    --sc-bad: #f87171; --sc-bad-soft: rgba(239, 68, 68, .14);
    --sc-warn: #fbbf24; --sc-warn-soft: rgba(245, 158, 11, .14);
}
.sc *, .sc *::before, .sc *::after { box-sizing: border-box; }
.sc button, .sc input, .sc select, .sc textarea { font-family: inherit; }
.sc :focus-visible { outline: 3px solid var(--sc-accent-line); outline-offset: 2px; }
.sc [hidden] { display: none !important; }
.sc h1, .sc h2, .sc h3, .sc h4, .sc p { margin: 0; }

/* ---------- buttons ---------- */
.sc-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 15px; border-radius: 11px; border: 1px solid var(--sc-border); background: var(--sc-surface); color: var(--sc-text); font-weight: 600; font-size: .87rem; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.sc-btn:hover { background: var(--sc-hover); }
.sc-btn.primary { background: var(--sc-accent); border-color: transparent; color: #fff; }
.sc-btn.primary:hover { background: var(--primary-dark, var(--sc-accent-2)); }
.sc-btn.ghost { background: transparent; border-color: transparent; color: var(--sc-text-2); }
.sc-btn.ghost:hover { background: var(--sc-hover); color: var(--sc-text); }
.sc-btn.ok { color: var(--sc-ok); } .sc-btn.ok:hover { background: var(--sc-ok-soft); }
.sc-btn.danger { color: var(--sc-bad); } .sc-btn.danger:hover { background: var(--sc-bad-soft); }
.sc-btn.sure { background: var(--sc-bad); border-color: transparent; color: #fff; }
.sc-btn.sm { height: 32px; padding: 0 11px; font-size: .8rem; border-radius: 9px; }
.sc-btn:disabled { opacity: .5; cursor: not-allowed; }
.sc-icon { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--sc-border); background: var(--sc-surface); color: var(--sc-text-2); cursor: pointer; display: grid; place-items: center; flex: 0 0 auto; }
.sc-icon:hover { background: var(--sc-hover); color: var(--sc-text); }

/* ---------- hero ---------- */
.sc-hero { position: relative; overflow: hidden; display: flex; gap: 18px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 22px 26px; margin-bottom: 16px; border-radius: 20px; color: #fff; background: linear-gradient(135deg, var(--sc-accent), var(--sc-accent-2)); box-shadow: 0 12px 30px color-mix(in srgb, var(--sc-accent) 28%, transparent); }
.sc-hero::after { content: ''; position: absolute; right: -70px; top: -90px; width: 260px; height: 260px; border-radius: 50%; background: rgba(255, 255, 255, .08); pointer-events: none; }
.sc-hero > * { position: relative; z-index: 1; }
.sc-hero small { font-size: .88rem; opacity: .9; }
.sc-hero h1 { font: 800 1.7rem/1.2 'Poppins', sans-serif; color: #fff; margin: 2px 0 6px; }
.sc-hero p { font-size: .94rem; opacity: .95; max-width: 640px; line-height: 1.5; }
.sc-hero-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.sc-hbtn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 15px; border-radius: 12px; font-weight: 700; font-size: .86rem; border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .14); color: #fff; cursor: pointer; transition: background .15s; }
.sc-hbtn:hover { background: rgba(255, 255, 255, .26); }
.sc-hbtn.solid { background: #fff; color: var(--sc-accent); border-color: #fff; }
.sc-hbtn.solid:hover { background: #eef2ff; }

/* ---------- KPIs ---------- */
.sc-kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.sc-kpi { padding: 14px 16px; border-radius: 16px; background: var(--sc-surface); border: 1px solid var(--sc-border); box-shadow: var(--sc-shadow); min-width: 0; }
.sc-kpi i { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 8px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.sc-kpi b { display: block; font: 700 1.3rem 'Poppins', sans-serif; color: var(--sc-text); font-variant-numeric: tabular-nums; }
.sc-kpi span { font-size: .76rem; color: var(--sc-text-3); }

/* ---------- note ---------- */
.sc-note { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 12px; font-size: .87rem; line-height: 1.45; margin-bottom: 14px; }
.sc-note.ok { background: var(--sc-ok-soft); color: var(--sc-ok); }
.sc-note.bad { background: var(--sc-bad-soft); color: var(--sc-bad); }
.sc-note.info { background: var(--sc-accent-soft); color: var(--sc-text); }
.sc-note i { margin-top: 2px; }

/* ---------- layout ---------- */
.sc-card { background: var(--sc-surface); border: 1px solid var(--sc-border); border-radius: 18px; box-shadow: var(--sc-shadow); padding: 16px; min-width: 0; }
.sc-card h3 { font: 700 .92rem 'Poppins', sans-serif; color: var(--sc-text); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.sc-card h3 small { margin-left: auto; font: 600 .74rem 'Inter', sans-serif; color: var(--sc-text-3); }
.sc-muted { font-size: .84rem; color: var(--sc-text-3); line-height: 1.5; }

/* mini calendar */
.sc-mhead { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.sc-mhead b { flex: 1; font: 700 .98rem 'Poppins', sans-serif; }
.sc-mhead .sc-icon { width: 32px; height: 32px; border-radius: 9px; }

/* filters */
.sc-lg { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; cursor: pointer; font-size: .85rem; color: var(--sc-text); }
.sc-lg:hover { background: var(--sc-hover); }
.sc-lg input { width: 17px; height: 17px; accent-color: var(--sc-accent); margin: 0; }
.sc-lg i { width: 10px; height: 10px; border-radius: 3px; background: var(--d); flex: 0 0 auto; }
.sc-lg em { margin-left: auto; font-style: normal; font-size: .74rem; color: var(--sc-text-3); }

/* side lists */
.sc-slist { display: flex; flex-direction: column; gap: 6px; }
.sc-sitem { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 11px; border: 1px solid var(--sc-border); background: var(--sc-surface-2); min-width: 0; }
.sc-sitem .bar { width: 4px; align-self: stretch; border-radius: 4px; background: var(--d); flex: 0 0 auto; }
.sc-sitem .tx { flex: 1; min-width: 0; }
.sc-sitem b { display: block; font-size: .83rem; color: var(--sc-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-sitem small { font-size: .74rem; color: var(--sc-text-3); }
.sc-sitem .acts { display: flex; gap: 4px; }

/* ---------- main ---------- */
.sc-main { min-width: 0; }
.sc-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 14px; margin-bottom: 12px; border-radius: 16px; background: var(--sc-surface); border: 1px solid var(--sc-border); box-shadow: var(--sc-shadow); }
.sc-bar h2 { font: 700 1.05rem 'Poppins', sans-serif; color: var(--sc-text); margin-left: 6px; flex: 1 1 200px; min-width: 0; }
.sc-bar h2 small { display: block; font: 500 .78rem 'Inter', sans-serif; color: var(--sc-text-3); margin-top: 2px; }
.sc-seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--sc-hover); }
.sc-seg button { height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; color: var(--sc-text-2); font-weight: 600; font-size: .83rem; cursor: pointer; }
.sc-seg button:hover { color: var(--sc-text); }
.sc-seg button[aria-pressed="true"] { background: var(--sc-surface); color: var(--sc-text); box-shadow: 0 1px 3px rgba(15, 23, 42, .12); }

/* time grid */
.sc-cal { background: var(--sc-surface); border: 1px solid var(--sc-border); border-radius: 16px; box-shadow: var(--sc-shadow); overflow: hidden; }
.sc-scroll { overflow-x: auto; }
.sc-heads { display: grid; grid-template-columns: 56px repeat(var(--cols), minmax(0, 1fr)); border-bottom: 1px solid var(--sc-border); background: var(--sc-surface); }
.sc-heads .h { padding: 10px 6px; text-align: center; border-left: 1px solid var(--sc-grid); min-width: 0; }
.sc-heads .h button { border: 0; background: transparent; cursor: pointer; color: inherit; padding: 2px 6px; border-radius: 8px; }
.sc-heads .h button:hover { background: var(--sc-hover); }
.sc-heads .h small { display: block; font-size: .72rem; font-weight: 700; color: var(--sc-text-3); text-transform: uppercase; letter-spacing: .4px; }
.sc-heads .h b { font: 700 1.15rem 'Poppins', sans-serif; color: var(--sc-text); }
.sc-heads .h.today b { color: #fff; background: var(--sc-accent); border-radius: 999px; padding: 0 8px; }
.sc-heads .h .mks { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
.sc-heads .h .mks span { display: block; padding: 2px 6px; border-radius: 6px; font-size: .68rem; font-weight: 700; color: #fff; background: var(--m); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-body { display: grid; grid-template-columns: 56px repeat(var(--cols), minmax(0, 1fr)); position: relative; max-height: 640px; overflow-y: auto; }
.sc-hours { position: relative; }
.sc-hours span { position: absolute; right: 8px; transform: translateY(-50%); font-size: .7rem; color: var(--sc-text-3); font-variant-numeric: tabular-nums; }
.sc-col { position: relative; border-left: 1px solid var(--sc-grid); background-image: repeating-linear-gradient(to bottom, var(--sc-grid) 0, var(--sc-grid) 1px, transparent 1px, transparent var(--sc-hour)); cursor: copy; }
.sc-col.past { background-color: color-mix(in srgb, var(--sc-hover) 55%, transparent); cursor: default; }
.sc-col.today { background-color: color-mix(in srgb, var(--sc-accent) 4%, transparent); }
.sc-now { position: absolute; left: 0; right: 0; height: 2px; background: #ef4444; z-index: 3; pointer-events: none; }
.sc-now::before { content: ''; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
.sc-ev { position: absolute; z-index: 2; border: 0; border-left: 3px solid var(--d); border-radius: 8px; padding: 4px 7px; text-align: left; cursor: pointer; overflow: hidden; background: color-mix(in srgb, var(--d) 15%, var(--sc-surface)); color: var(--sc-text); font-size: .74rem; line-height: 1.3; transition: box-shadow .12s, filter .12s; }
.sc-ev:hover { box-shadow: 0 4px 12px rgba(15, 23, 42, .18); z-index: 4; filter: saturate(1.15); }
.sc-ev b { display: block; font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-ev small { display: block; color: var(--sc-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-ev.done { opacity: .6; }
.sc-ev.done b { text-decoration: line-through; }
.sc-ev.missed { opacity: .6; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--d) 12%, var(--sc-surface)) 0 6px, var(--sc-surface) 6px 12px); }
.sc-ev .ic { float: right; font-size: .68rem; margin-left: 4px; color: var(--d); }

/* agenda */
.sc-agenda { display: flex; flex-direction: column; gap: 14px; }
.sc-aday { background: var(--sc-surface); border: 1px solid var(--sc-border); border-radius: 16px; box-shadow: var(--sc-shadow); overflow: hidden; }
.sc-aday-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--sc-border); background: var(--sc-surface-2); }
.sc-aday-h b { font: 700 .95rem 'Poppins', sans-serif; }
.sc-aday-h small { font-size: .78rem; color: var(--sc-text-3); }
.sc-aday-h .today-tag { padding: 2px 8px; border-radius: 999px; font-size: .7rem; font-weight: 800; background: var(--sc-accent); color: #fff; }
.sc-mchip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .72rem; font-weight: 700; color: #fff; background: var(--m); }
.sc-arow { display: grid; grid-template-columns: 92px 4px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 16px; border: 0; border-top: 1px solid var(--sc-grid); background: transparent; width: 100%; text-align: left; cursor: pointer; color: inherit; transition: background .12s; }
.sc-arow:first-of-type { border-top: 0; }
.sc-arow:hover { background: var(--sc-hover); }
.sc-arow .t { font-weight: 700; font-size: .88rem; font-variant-numeric: tabular-nums; }
.sc-arow .t small { display: block; font-weight: 500; font-size: .74rem; color: var(--sc-text-3); }
.sc-arow .bar { align-self: stretch; border-radius: 4px; background: var(--d); }
.sc-arow .tx b { display: block; font-size: .92rem; color: var(--sc-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-arow .tx span { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 3px; font-size: .78rem; color: var(--sc-text-3); }
.sc-arow.done .tx b { text-decoration: line-through; color: var(--sc-text-3); }
.sc-chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .72rem; font-weight: 700; white-space: nowrap; }
.sc-chip.k { background: color-mix(in srgb, var(--d) 14%, transparent); color: var(--d); }
.sc-chip.now { background: #ef4444; color: #fff; }
.sc-chip.next { background: var(--sc-accent-soft); color: var(--sc-accent); }
.sc-chip.done { background: var(--sc-ok-soft); color: var(--sc-ok); }
.sc-chip.missed { background: var(--sc-bad-soft); color: var(--sc-bad); }
.sc-chip.ended { background: var(--sc-warn-soft); color: var(--sc-warn); }
.sc-empty { text-align: center; padding: 40px 16px; color: var(--sc-text-3); }
.sc-empty i { font-size: 2rem; opacity: .6; display: block; margin-bottom: 10px; }
.sc-empty h3 { font: 700 1rem 'Poppins', sans-serif; color: var(--sc-text); margin-bottom: 4px; }
.sc-empty p { font-size: .86rem; margin-bottom: 14px; }
.sc-skel { height: 14px; border-radius: 7px; margin: 12px 16px; background: linear-gradient(90deg, var(--sc-hover), var(--sc-surface-2), var(--sc-hover)); background-size: 200% 100%; animation: scSk 1.2s infinite; }
@keyframes scSk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------- drawer (details / editor / mark) ---------- */
#scDrawer { position: fixed; inset: 0; z-index: 3500; display: none; }
#scDrawer.show { display: block; }
.sc-scrim { position: absolute; inset: 0; background: rgba(15, 23, 42, .45); animation: scFade .15s ease; }
.sc-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(500px, 100%); display: flex; flex-direction: column; background: var(--sc-surface); color: var(--sc-text); box-shadow: -10px 0 40px rgba(15, 23, 42, .25); animation: scIn .2s ease; font-family: 'Inter', system-ui, sans-serif; }
@keyframes scIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes scFade { from { opacity: 0; } to { opacity: 1; } }
.sc-ph { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--sc-border); }
.sc-ph .tx { flex: 1; min-width: 0; }
.sc-ph h2 { font: 700 1.15rem/1.3 'Poppins', sans-serif; color: var(--sc-text); overflow-wrap: anywhere; }
.sc-ph p { font-size: .84rem; color: var(--sc-text-3); margin-top: 4px; }
.sc-pb { flex: 1; overflow-y: auto; padding: 18px 20px; }
.sc-pf { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 14px 20px; border-top: 1px solid var(--sc-border); }
.sc-pf .msg { flex: 1 1 100%; font-size: .82rem; font-weight: 600; }
.sc-pf .msg:empty { display: none; }
.sc-pf .msg.bad { color: var(--sc-bad); } .sc-pf .msg.ok { color: var(--sc-ok); } .sc-pf .msg.warn { color: var(--sc-warn); }
.sc-rows { display: flex; flex-direction: column; gap: 12px; }
.sc-row { display: flex; gap: 12px; align-items: flex-start; }
.sc-row > i { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: 0 0 auto; background: var(--sc-accent-soft); color: var(--sc-accent); font-size: .85rem; }
.sc-row b { display: block; font-size: .74rem; color: var(--sc-text-3); font-weight: 600; }
.sc-row span, .sc-row a { font-size: .92rem; font-weight: 600; color: var(--sc-text); overflow-wrap: anywhere; }
.sc-row a { color: var(--sc-accent); }
.sc-notes { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: var(--sc-surface-2); border: 1px solid var(--sc-border); font-size: .88rem; line-height: 1.55; white-space: pre-line; overflow-wrap: anywhere; }
.sc-stbox { margin-top: 16px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--sc-border); }
.sc-stbox b { display: block; font-size: .84rem; margin-bottom: 8px; }
.sc-stbox .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.sc-del { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: var(--sc-bad-soft); }
.sc-del b { display: block; color: var(--sc-bad); font-size: .86rem; margin-bottom: 8px; }
.sc-del .btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* form */
.sc-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sc-f { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.sc-f.wide { grid-column: 1 / -1; }
.sc-f > label, .sc-f > .lbl { font-size: .8rem; font-weight: 700; color: var(--sc-text-2); }
.sc-f > label .req { color: var(--sc-bad); }
.sc-in, .sc-sel, .sc-ta { width: 100%; border-radius: 10px; border: 1px solid var(--sc-border); background: var(--sc-surface-2); color: var(--sc-text); font-size: .9rem; }
.sc-in, .sc-sel { height: 42px; padding: 0 12px; }
.sc-ta { min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.sc-in:focus, .sc-sel:focus, .sc-ta:focus { outline: none; border-color: var(--sc-accent); box-shadow: 0 0 0 3px var(--sc-accent-soft); }
.sc-f.err .sc-in, .sc-f.err .sc-sel { border-color: var(--sc-bad); }
.sc-ferr { font-size: .76rem; font-weight: 600; color: var(--sc-bad); }
.sc-ferr:empty { display: none; }
.sc-hint { font-size: .74rem; color: var(--sc-text-3); }
.sc-kinds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.sc-kinds label { position: relative; cursor: pointer; }
.sc-kinds input { position: absolute; opacity: 0; pointer-events: none; }
.sc-kinds span { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--sc-border); background: var(--sc-surface-2); font-size: .76rem; font-weight: 600; color: var(--sc-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-kinds span::before { content: ''; width: 9px; height: 9px; border-radius: 3px; background: var(--d); flex: 0 0 auto; }
.sc-kinds input:checked + span { border-color: var(--d); background: color-mix(in srgb, var(--d) 13%, transparent); color: var(--sc-text); }
.sc-kinds input:focus-visible + span { outline: 3px solid var(--sc-accent-line); outline-offset: 2px; }
.sc-durs { display: flex; gap: 6px; flex-wrap: wrap; }
.sc-durs button { height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--sc-border); background: var(--sc-surface-2); color: var(--sc-text-2); font-size: .78rem; font-weight: 600; cursor: pointer; }
.sc-durs button[aria-pressed="true"] { background: var(--sc-accent); border-color: var(--sc-accent); color: #fff; }
.sc-conflict { grid-column: 1 / -1; padding: 10px 12px; border-radius: 10px; background: var(--sc-warn-soft); color: var(--sc-warn); font-size: .82rem; line-height: 1.45; }
.sc-swatches { display: flex; gap: 8px; flex-wrap: wrap; }

.sc-swatches input { position: absolute; opacity: 0; pointer-events: none; }
.sc-swatches span { display: block; width: 30px; height: 30px; border-radius: 50%; background: var(--m); box-shadow: inset 0 0 0 3px var(--sc-surface); border: 2px solid transparent; }
.sc-swatches input:checked + span { border-color: var(--m); }
.sc-swatches input:focus-visible + span { outline: 3px solid var(--sc-accent-line); outline-offset: 2px; }
.sc-check { display: flex; align-items: center; gap: 10px; font-size: .88rem; cursor: pointer; }
.sc-check input { width: 18px; height: 18px; accent-color: var(--sc-accent); margin: 0; }

/* lesson with a teacher (in the details drawer) */
.sc-lesson { margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: .88rem; line-height: 1.5; display: flex; gap: 10px; }
.sc-lesson i { margin-top: 3px; }
.sc-lesson.info { background: var(--sc-accent-soft); color: var(--sc-text); }
.sc-lesson.ok { background: var(--sc-ok-soft); color: var(--sc-ok); }
.sc-lesson.warn { background: var(--sc-warn-soft); color: var(--sc-warn); }
.sc-lesson.bad { background: var(--sc-bad-soft); color: var(--sc-bad); }

/* ---------- My Goals page ---------- */
.gl { margin-bottom: 16px; }
.gl-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.gl-head h2 { font: 700 1.15rem 'Poppins', sans-serif; display: flex; align-items: center; gap: 8px; margin-right: auto; }
.gl-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
.gl-side { display: flex; flex-direction: column; gap: 16px; }
.gl-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.gc { background: var(--sc-surface); border: 1px solid var(--sc-border); border-radius: 18px; box-shadow: var(--sc-shadow); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; border-top: 4px solid var(--p, var(--sc-accent)); }
.gc.p-high { --p: #ef4444; } .gc.p-medium { --p: #f59e0b; } .gc.p-low { --p: #22c55e; }
.gc-top { display: flex; gap: 10px; align-items: flex-start; }
.gc-ic { width: 38px; height: 38px; flex: none; border-radius: 11px; display: grid; place-items: center; background: var(--sc-accent-soft); color: var(--sc-accent); }
.gc h3 { font: 700 .98rem/1.3 'Poppins', sans-serif; color: var(--sc-text); }
.gc .why { font-size: .82rem; color: var(--sc-text-2); font-style: italic; margin-top: 2px; }
.gc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.pri { font-size: .68rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .3px; }
.pri.high { background: var(--sc-bad-soft); color: var(--sc-bad); } .pri.medium { background: var(--sc-warn-soft); color: var(--sc-warn); } .pri.low { background: var(--sc-ok-soft); color: var(--sc-ok); }
.gbar { position: relative; height: 10px; border-radius: 999px; background: var(--sc-hover); margin: 6px 0 2px; }
.gbar > span { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(90deg, var(--sc-accent), #14b8a6); }
.gbar > i { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--sc-text-3); opacity: .7; }
.gbar > u { position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; transform: rotate(45deg); border-radius: 2px; background: var(--sc-surface); border: 2px solid var(--sc-text-3); }
.gbar > u.hit { background: var(--sc-ok); border-color: var(--sc-ok); } .gbar > u.missed { background: var(--sc-bad); border-color: var(--sc-bad); }
.gc-row { display: flex; justify-content: space-between; gap: 8px; font-size: .82rem; color: var(--sc-text-2); flex-wrap: wrap; }
.gc-meta { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--sc-text-3); }
.gc-meta i { width: 16px; color: var(--sc-accent); }
.gc-tip { font-size: .83rem; line-height: 1.45; padding: 9px 11px; border-radius: 10px; background: var(--sc-surface-2); color: var(--sc-text-2); }
.gc-foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.gl-empty { grid-column: 1 / -1; }
.hab-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 110px; margin: 6px 0 4px; }
.hab-bars div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
.hab-bars span { width: 100%; max-width: 28px; border-radius: 6px 6px 2px 2px; background: color-mix(in srgb, var(--sc-accent) 30%, transparent); min-height: 3px; }
.hab-bars span.top { background: var(--sc-accent); }
.hab-bars small { font-size: .7rem; color: var(--sc-text-3); font-weight: 700; }
.hab-parts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.hab-parts div { text-align: center; padding: 8px 4px; border-radius: 10px; background: var(--sc-surface-2); border: 1px solid var(--sc-border); }
.hab-parts div.top { border-color: var(--sc-accent); background: var(--sc-accent-soft); }

.sum-rows { display: flex; flex-direction: column; gap: 8px; font-size: .86rem; }
.sum-rows div { display: flex; justify-content: space-between; gap: 8px; }
.sum-rows span { color: var(--sc-text-3); }
/* goal form */
.gf-step { grid-column: 1 / -1; font: 700 .8rem 'Poppins', sans-serif; color: var(--sc-accent); text-transform: uppercase; letter-spacing: .5px; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--sc-border); }
.gf-step:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.gf-days { display: flex; gap: 6px; flex-wrap: wrap; }
.gf-days button, .gf-pri button { height: 34px; min-width: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--sc-border); background: var(--sc-surface-2); color: var(--sc-text-2); font-weight: 700; font-size: .8rem; cursor: pointer; }
.gf-days button[aria-pressed="true"] { background: var(--sc-accent); border-color: var(--sc-accent); color: #fff; }
.gf-pri { display: flex; gap: 6px; }
.gf-pri button[aria-pressed="true"].high { background: #ef4444; border-color: #ef4444; color: #fff; }
.gf-pri button[aria-pressed="true"].medium { background: #f59e0b; border-color: #f59e0b; color: #fff; }

/* goal details */

.gd-big b { font: 800 2rem 'Poppins', sans-serif; color: var(--sc-text); }
.gd-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.gd-nums div { padding: 10px; border-radius: 12px; background: var(--sc-surface-2); border: 1px solid var(--sc-border); }

.gd-nums small { font-size: .72rem; color: var(--sc-text-3); }
.gd-chart { margin: 8px 0 4px; padding: 10px; border-radius: 12px; border: 1px solid var(--sc-border); background: var(--sc-surface-2); }
.gd-chart svg { width: 100%; height: auto; display: block; }
.gd-legend { display: flex; gap: 14px; font-size: .74rem; color: var(--sc-text-3); margin-top: 6px; }
.gd-legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.gd-sec { font: 700 .86rem 'Poppins', sans-serif; margin: 16px 0 8px; }
.gd-ms { display: flex; flex-direction: column; gap: 6px; }
.gd-ms div { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--sc-border); font-size: .84rem; }
.gd-ms div.hit { background: var(--sc-ok-soft); border-color: transparent; } .gd-ms div.missed { background: var(--sc-bad-soft); border-color: transparent; }
.gd-ms em { margin-left: auto; font-style: normal; font-size: .74rem; font-weight: 700; }
/* small schedule */
.scs { padding: 16px; margin-top: 4px; --sc-hour: 40px; }
.scs-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.scs-head h2 { font: 700 1.05rem 'Poppins', sans-serif; display: flex; align-items: center; gap: 8px; margin-right: auto; }
.plans { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.plan { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--sc-border); background: var(--sc-surface-2); color: var(--sc-text-2); font-weight: 600; font-size: .8rem; cursor: pointer; }
.plan i { width: 9px; height: 9px; border-radius: 50%; background: var(--d, var(--sc-text-3)); }
.plan[aria-pressed="true"] { background: var(--sc-accent); border-color: var(--sc-accent); color: #fff; }
.plan[aria-pressed="true"] i { background: #fff; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-f { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--sc-border); font-size: .76rem; font-weight: 600; color: var(--sc-text-2); cursor: pointer; user-select: none; }
.chip-f input { display: none; }
.chip-f i { width: 9px; height: 9px; border-radius: 3px; background: var(--d); }
.chip-f:has(input:not(:checked)) { opacity: .45; text-decoration: line-through; }
.scs .sc-bar { box-shadow: none; background: var(--sc-surface-2); }
.scs .sc-body { max-height: 440px; }
.scs .sc-cal { box-shadow: none; }

/* ---------- My goals ---------- */
.mg { margin-top: 16px; }
.mg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.mg-head h3 { margin: 0; font: 700 1.02rem 'Poppins', sans-serif; display: flex; align-items: center; gap: 8px; }
.mg-head p { font-size: .82rem; color: var(--sc-text-3); margin-top: 2px; }
.mg-over { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.mg-stat { padding: 10px 12px; border-radius: 12px; background: var(--sc-surface-2); border: 1px solid var(--sc-border); }
.mg-stat b { display: block; font: 700 1.15rem 'Poppins', sans-serif; color: var(--sc-text); }
.mg-stat span { font-size: .74rem; color: var(--sc-text-3); }
.mg-advice { display: flex; gap: 8px; align-items: flex-start; padding: 10px 14px; border-radius: 12px; background: var(--sc-accent-soft); color: var(--sc-text-2); font-size: .85rem; line-height: 1.5; margin-bottom: 12px; }
.mg-advice i { color: var(--sc-accent); margin-top: 3px; }
.mg-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.mg-goal { padding: 14px; border-radius: 14px; border: 1px solid var(--sc-border); background: var(--sc-surface-2); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mg-top { display: flex; align-items: flex-start; gap: 10px; }
.mg-ic { width: 32px; height: 32px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--sc-accent-soft); color: var(--sc-accent); }
.mg-goal h4 { margin: 0; font-size: .92rem; color: var(--sc-text); line-height: 1.35; }
.mg-goal small { color: var(--sc-text-3); font-size: .75rem; }
.mg-bar { height: 8px; border-radius: 999px; background: var(--sc-hover); position: relative; overflow: hidden; }
.mg-bar span { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(90deg, var(--sc-accent), #14b8a6); }
.mg-bar i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--sc-text-3); opacity: .6; }
.mg-row { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--sc-text-2); }
.mg-tip { font-size: .82rem; color: var(--sc-text-2); line-height: 1.45; }
.mg-pace { margin-left: auto; font-size: .7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.mg-pace.ahead, .mg-pace.done { background: var(--sc-ok-soft); color: var(--sc-ok); }
.mg-pace.on_track { background: var(--sc-accent-soft); color: var(--sc-accent); }
.mg-pace.behind { background: var(--sc-warn-soft); color: var(--sc-warn); }
.mg-pace.missed { background: var(--sc-bad-soft); color: var(--sc-bad); }
.mg-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .78rem; color: var(--sc-text-3); }
.mg-past { margin-top: 12px; }
.mg-past summary { cursor: pointer; font-weight: 600; font-size: .86rem; color: var(--sc-text-2); padding: 6px 0; }
.mg-past .mg-list { margin-top: 10px; }

/* ---------- responsive ---------- */
@media (max-width: 1200px) { .sc-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .gl-wrap { grid-template-columns: minmax(0, 1fr); } .gl-side { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1000px) {
    .sc-main { order: -1; }
}
@media (max-width: 700px) {
    .sc-hero { padding: 18px; border-radius: 16px; }
    .sc-hero h1 { font-size: 1.35rem; }
    .sc-hero-btns { width: 100%; }
    .sc-hbtn { flex: 1 1 auto; justify-content: center; }
    .sc-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .mg-over { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .gl-side { grid-template-columns: minmax(0, 1fr); }
    .gl-cards { grid-template-columns: minmax(0, 1fr); }
    .gd-nums { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sc-bar h2 { flex-basis: 100%; order: -1; margin: 0 0 4px; }
    .sc-seg { margin-left: auto; }
    .sc-arow { grid-template-columns: 70px 4px minmax(0, 1fr); gap: 10px; padding: 12px; }
    .sc-arow > :last-child:not(.tx) { grid-column: 3; justify-self: start; }
    .sc-form { grid-template-columns: minmax(0, 1fr); }
    .sc-kinds { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sc-heads .h b { font-size: 1rem; }
    .sc-body { max-height: 560px; }
}
@media print {
    .sc-hero-btns, .sc-bar .sc-seg, .sc-bar .sc-icon, .sc-bar .sc-btn, #scDrawer, .sc-note { display: none !important; }
    .sc-body { max-height: none; overflow: visible; }
    .sc-hero { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>

<div class="sc" data-no-theme id="sc" data-email="{{ session.get('email', '') }}">
    <header class="sc-hero">
        <div>
            <small id="heroDate"></small>
            <h1>My Goals</h1>
            <p id="heroText">Loading your goals…</p>
        </div>
        <div class="sc-hero-btns">
            <button type="button" class="sc-hbtn solid" data-goalnew><i class="fas fa-bullseye"></i> Set a goal</button>
            <button type="button" class="sc-hbtn" id="newBtn"><i class="fas fa-plus"></i> Add to schedule</button>
            <button type="button" class="sc-hbtn" id="markBtn"><i class="fas fa-star"></i> Mark a day</button>
        </div>
    </header>

    {% if has_parent_goals %}{% include "Learner/goals-card.html" %}{% endif %}

    <div class="sc-kpis" id="kpis"></div>
    <div id="note" role="status" aria-live="polite" hidden></div>

    <!-- ===== GOALS (the main part) ===== -->
    <section class="gl" aria-labelledby="glTitle">
        <div class="gl-head">
            <h2 id="glTitle"><i class="fas fa-bullseye" style="color:var(--sc-accent)"></i> Goals</h2>
            <div class="sc-seg" role="group" aria-label="Which goals">
                <button type="button" data-gtab="active" aria-pressed="true">Running</button>
                <button type="button" data-gtab="past" aria-pressed="false">Finished</button>
            </div>
            <button type="button" class="sc-btn primary" data-goalnew><i class="fas fa-plus"></i> Set a goal</button>
        </div>
        <div class="mg-advice" id="mgAdvice" hidden><i class="fas fa-lightbulb"></i><span></span></div>
        <div class="gl-wrap">
            <div class="gl-cards" id="glCards"><div class="sc-card"><div class="sc-skel"></div><div class="sc-skel"></div></div></div>
            <aside class="gl-side">
                <section class="sc-card" aria-labelledby="habT">
                    <h3 id="habT"><i class="fas fa-chart-column" style="color:var(--sc-accent)"></i> When you learn best <small>last 90 days</small></h3>
                    <div id="habits"><div class="sc-skel"></div></div>
                </section>
                <section class="sc-card" aria-labelledby="sumT">
                    <h3 id="sumT"><i class="fas fa-chart-pie" style="color:#14b8a6"></i> Your goals so far</h3>
                    <div class="sum-rows" id="summary"></div>
                </section>
            </aside>
        </div>

    <!-- ===== SCHEDULE (smaller): plans, goals' study time, lessons, live classes ===== -->
    <section class="sc-card scs" aria-labelledby="schT">
        <div class="scs-head">
            <h2 id="schT"><i class="fas fa-calendar-alt" style="color:var(--sc-accent)"></i> Schedule</h2>
            <button type="button" class="sc-btn sm" id="icsBtn" title="Add the next 60 days to Google Calendar, Outlook or your phone"><i class="fas fa-calendar-plus"></i> Calendar app</button>
            <button type="button" class="sc-btn sm" id="printBtn"><i class="fas fa-print"></i> Print</button>
        </div>
        <div class="plans" id="plans" role="group" aria-label="Study plans"></div>
        <div class="sc-bar">
            <button type="button" class="sc-btn" id="todayBtn">Today</button>
            <button type="button" class="sc-icon" id="prevBtn" aria-label="Previous"><i class="fas fa-chevron-left"></i></button>
            <button type="button" class="sc-icon" id="nextBtn" aria-label="Next"><i class="fas fa-chevron-right"></i></button>
            <h2 id="rangeTitle"></h2>
            <div class="sc-seg" role="group" aria-label="View">
                <button type="button" data-view="day" aria-pressed="false">Day</button>
                <button type="button" data-view="week" aria-pressed="true">Week</button>
                <button type="button" data-view="agenda" aria-pressed="false">List</button>
            </div>
        </div>
        <div class="chips" id="legend" style="margin-bottom:10px"></div>
        <div id="view"><div class="sc-cal"><div class="sc-skel"></div><div class="sc-skel"></div></div></div>
    </section>
</div>

<div id="scDrawer" class="sc" data-no-theme role="dialog" aria-modal="true" aria-labelledby="drTitle" style="max-width:none;margin:0">
    <div class="sc-scrim" data-close></div>
    <div class="sc-panel" id="drPanel"></div>
</div>

<script>
(() => {
"use strict";
const TZ = "Africa/Nairobi";
const root = document.getElementById("sc");
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") || /^\/(?!\/)/.test(u || "") ? u : "";
const pad = n => String(n).padStart(2, "0");

/* ---------- dates (all in Nairobi time) ---------- */
const fmtParts = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
function nb(ts) {   // {day:'YYYY-MM-DD', min: minutes after midnight} for a UTC timestamp
    const p = Object.fromEntries(fmtParts.formatToParts(new Date(ts)).map(x => [x.type, x.value]));
    return { day: `${p.year}-${p.month}-${p.day}`, min: Number(p.hour) * 60 + Number(p.minute) };
}
const hm = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const addDays = (key, n) => { const d = new Date(key + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dow = key => (new Date(key + "T12:00:00Z").getUTCDay() + 6) % 7;      // Monday = 0
const monday = key => addDays(key, -dow(key));
const longDay = (key, o) => new Date(key + "T12:00:00Z").toLocaleDateString("en-GB", Object.assign({ timeZone: "UTC", weekday: "long", day: "numeric", month: "long" }, o || {}));

/* ---------- state ---------- */

async function api(url, opts) {
    const r = await fetch(url, Object.assign({ credentials: "same-origin" }, opts || {}));
    if (r.status === 401) { location.href = "/login"; throw new Error("Please sign in again."); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.success === false) throw Object.assign(new Error(d.message || `Something went wrong (${r.status}).`), { errors: d.errors || {} });
    return d;
}
const send = (url, method, body) => api(url, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });

    const n = $("note");

    n.className = "sc-note " + (kind || "info"); n.hidden = false;
    n.innerHTML = `<i class="fas ${kind === "bad" ? "fa-circle-exclamation" : kind === "ok" ? "fa-circle-check" : "fa-circle-info"}"></i><div>${esc(text)}</div>`;
    clearTimeout(note.t); note.t = setTimeout(() => { n.hidden = true; }, 6000);
}

/* ---------- loading ---------- */
let loadSeq = 0;
async function load(force) {
    const need = [addDays(sel, -10), addDays(sel, 40), addDays(miniMonth + "-01", -7), addDays(miniMonth + "-01", 42), addDays(TODAY, -15), addDays(TODAY, 8)];
    const lo = need.reduce((a, b) => a < b ? a : b), hi = need.reduce((a, b) => a > b ? a : b);
    if (!force && rangeFrom && lo >= rangeFrom && hi <= rangeTo) return draw();
    const from = addDays(lo, -14), to = addDays(hi, 21);
    const my = ++loadSeq;            // pressing Next quickly: only the newest answer is used
    try {
        const d = await api(`/api/teacher/schedule?from=${from}&to=${to}`);
        if (my !== loadSeq) return;
        data = d; rangeFrom = from; rangeTo = to; TODAY = d.today || TODAY;
    } catch (e) { if (my !== loadSeq) return; note("Couldn’t load your schedule: " + e.message, "bad"); }
    draw();
}

/* ---------- helpers on items ---------- */

}

    return true;
}

}

/* ---------- main views ---------- */
function drawView() {
    document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
    if (view === "agenda") return drawAgenda();
    const days = view === "week" ? Array.from({ length: 7 }, (_, i) => addDays(monday(sel), i)) : [sel];
    $("rangeTitle").innerHTML = view === "week"
        ? `${esc(shortDay(days[0]))} – ${esc(shortDay(days[6]))} ${days[6].slice(0, 4)}<small>Week ${isoWeek(days[0])} · tap an empty time to add an event</small>`
        : `${esc(longDay(sel, { year: "numeric" }))}<small>${sel === TODAY ? "Today" : sel < TODAY ? "Past day" : "Tap an empty time to add an event"}</small>`;
    const all = days.map(d => itemsOn(d));
    const minH = 0, maxH = 24;          // the whole day, midnight to midnight (the grid scrolls)
    const nowP = nb(Date.now());
    const H = hourPx(), total = (maxH - minH) * H;
    const oldGrid = $("grid"), keepScroll = oldGrid ? oldGrid.scrollTop : null, scrollKey = view + "|" + days[0] + "|" + TODAY;
    const heads = days.map(d => {
        const mk = marksOn(d);
        return `<div class="h ${d === TODAY ? "today" : ""}"><button type="button" data-goday="${d}" aria-label="Open ${longDay(d)}"><small>${new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone: "UTC", weekday: "short" })}</small><b>${Number(d.slice(8))}</b></button>
            ${mk.length ? `<div class="mks">${mk.map(m => `<span style="--m:${safeColor(m.color, "#ec4899")}" title="${esc(m.label)}">${m.goal ? "🎯" : "★"} ${esc(m.label)}</span>`).join("")}</div>` : ""}</div>`;
    }).join("");
    const hours = Array.from({ length: maxH - minH }, (_, i) => `<span style="top:${i * H}px${i ? "" : ";transform:none"}">${pad(minH + i)}:00</span>`).join("");
    const cols = days.map((d, ci) => {
        const items = all[ci];
        // side-by-side lanes for items that overlap
        const lanes = [], placed = [];
        items.forEach(x => {
            const s = x._min, e = x._min + Math.max(x.minutes, 20);
            let lane = lanes.findIndex(end => end <= s); if (lane < 0) { lane = lanes.length; lanes.push(0); }
            lanes[lane] = e; placed.push({ x, lane, s, e });
        });
        placed.forEach(p => { p.n = Math.max(1, ...placed.filter(q => q.s < p.e && p.s < q.e).map(q => q.lane + 1)); });
        const blocks = placed.map(p => {
            const x = p.x, st = stateOf(x), top = (p.s - minH * 60) / 60 * H, h = Math.max(22, x.minutes / 60 * H - 2);
            const w = 100 / p.n;
            return `<button type="button" class="sc-ev ${st === "done" ? "done" : st === "missed" ? "missed" : ""}" style="--d:${esc(x._color)};top:${top}px;height:${h}px;left:calc(${p.lane * w}% + 2px);width:calc(${w}% - 4px)" data-open="${esc(keyOf(x))}" aria-label="${esc(x.title)}, ${hm(x._min)} to ${hm(x._min + x.minutes)}, ${esc(typeLabel(x))}">
                <i class="fas ${typeIcon(x)} ic" aria-hidden="true"></i><b>${esc(x.title)}</b>${h > 34 ? `<small>${hm(x._min)}–${hm(x._min + x.minutes)}${x.teacher ? " · " + esc(x.teacher) : x.location ? " · " + esc(x.location) : ""}</small>` : ""}</button>`;
        }).join("");
        const now = d === nowP.day ? `<div class="sc-now" style="top:${(nowP.min - minH * 60) / 60 * H}px"></div>` : "";
        return `<div class="sc-col ${d < TODAY ? "past" : ""} ${d === TODAY ? "today" : ""}" data-col="${d}" data-min="${minH}" style="height:${total}px">${blocks}${now}</div>`;
    }).join("");
    const empty = !all.flat().length;
    $("view").innerHTML = `<div class="sc-cal"><div class="sc-scroll"><div style="min-width:${view === "week" ? 640 : 0}px;--cols:${days.length}">
        <div class="sc-heads">${'<div></div>'}${heads}</div>
        <div class="sc-body" id="grid"><div class="sc-hours" style="height:${total}px">${hours}</div>${cols}</div>
        </div></div></div>
        ${empty ? `<div class="sc-card" style="margin-top:12px"><div class="sc-empty" style="padding:18px"><i class="far fa-calendar"></i><h3>${view === "week" ? "Nothing this week" : "Nothing on this day"}</h3><p>${sel < TODAY && view === "day" ? "This day has passed." : "Add a class, study time, an exam or an assignment. Your goals' study time, lessons with teachers and live classes you follow appear here on their own."}</p>${sel >= TODAY || view === "week" ? '<button type="button" class="sc-btn primary" data-new><i class="fas fa-plus"></i> New event</button>' : ""}</div></div>` : ""}`;
    const g = $("grid");
    if (g) {
        if (drawView.scrollKey === scrollKey && keepScroll != null) g.scrollTop = keepScroll;   // a refresh: stay where you were
        else { const first = all.flat()[0]; const focus = days.includes(nowP.day) ? nowP.min : first ? first._min : 8 * 60; g.scrollTop = Math.max(0, (focus - minH * 60) / 60 * H - 80); }
        drawView.scrollKey = scrollKey;
    }
}
function isoWeek(key) { const d = new Date(key + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + 3 - (d.getUTCDay() + 6) % 7); const w1 = new Date(Date.UTC(d.getUTCFullYear(), 0, 4)); return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getUTCDay() + 6) % 7) / 7); }
function drawAgenda() {
    const end = addDays(sel, 29);
    $("rangeTitle").innerHTML = `${esc(shortDay(sel))} – ${esc(shortDay(end))}<small>30 days from the selected day</small>`;
    let html = "", count = 0, nextMarked = false;
    for (let i = 0; i < 30; i++) {
        const d = addDays(sel, i), items = itemsOn(d), mk = marksOn(d);
        if (!items.length && !mk.length) continue;
        count += items.length;
        html += `<section class="sc-aday"><div class="sc-aday-h"><b>${esc(longDay(d))}</b>${d === TODAY ? '<span class="today-tag">Today</span>' : ""}<small>${items.length ? `${items.length} item${items.length === 1 ? "" : "s"} · ${durText(items.reduce((a, x) => a + x.minutes, 0))}` : ""}</small>${mk.map(m => `<span class="sc-mchip" style="--m:${safeColor(m.color, "#ec4899")}">★ ${esc(m.label)}</span>`).join("")}</div>
            ${items.map(x => {
                const st = stateOf(x); let chip = stateChip(st);
                if (st === "upcoming" && !nextMarked) { nextMarked = true; chip = '<span class="sc-chip next">Up next</span>'; }
                const meta = [x.subject && x.type !== "lesson" ? x.subject + (x.grade ? " · " + x.grade : "") : "", x.teacher ? "with " + x.teacher : "", x.location, x.repeat && x.repeat !== "none" ? "Repeats " + ({ daily: "daily", weekdays: "on weekdays", weekly: "weekly" }[x.repeat]) : ""].filter(Boolean);
                return `<button type="button" class="sc-arow ${st === "done" ? "done" : ""}" data-open="${esc(keyOf(x))}"><span class="t">${hm(x._min)}<small>${durText(x.minutes)}</small></span><span class="bar" style="--d:${esc(x._color)}"></span>
                    <span class="tx"><b>${esc(x.title)}</b><span><span class="sc-chip k" style="--d:${esc(x._color)}"><i class="fas ${typeIcon(x)}"></i> ${esc(typeLabel(x))}</span>${meta.map(m => `<span>${esc(m)}</span>`).join("")}</span></span>${chip}</button>`;

}

/* ---------- drawer ---------- */
const drawer = $("scDrawer"), panel = $("drPanel"); let lastFocus = null, current = null;

            ${link ? `<div class="sc-row"><i class="fas fa-link" aria-hidden="true"></i><div><b>Link</b><a href="${esc(link)}" target="_blank" rel="noopener">${esc(link)}</a></div></div>` : ""}</div>

function conflicts(v) {
    if (!v.day || !v.start_time || v.minutes < 5) return [];
    const [h, m] = v.start_time.split(":").map(Number), s = h * 60 + m, e = s + v.minutes, editing = Number(panel.dataset.editing || 0);

        for (let d = addDays(v.day, 1), n = 0; d <= last && n < 120; d = addDays(d, 1), n++) {

}

async function exportIcs() {
    const btn = $("icsBtn"); btn.disabled = true;
    try {
        const d = await api(`/api/teacher/schedule?from=${TODAY}&to=${addDays(TODAY, 60)}`);
        const stamp = t => new Date(t).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
        const txt = s => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
        const fold = l => l.length <= 74 ? l : l.match(/.{1,74}/g).join("\r\n ");
        const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Eschool//Learner schedule//EN", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Eschool schedule"];
        d.items.forEach(x => {
            const s = Date.parse(x.start);
            lines.push("BEGIN:VEVENT", `UID:${x.type}-${x.id}-${x.day}@eschool`, `DTSTAMP:${stamp(Date.now())}`, `DTSTART:${stamp(s)}`, `DTEND:${stamp(s + x.minutes * 60000)}`,
                fold(`SUMMARY:${txt(x.title)}`), fold(`DESCRIPTION:${txt([x.kind_label, x.subject, x.grade, x.student, x.notes].filter(Boolean).join(" · "))}`),
                ...(x.location ? [fold(`LOCATION:${txt(x.location)}`)] : []), ...(safeUrl(x.link) ? [fold(`URL:${x.link}`)] : []), "END:VEVENT");
        });
        d.marks.forEach(m => {
            const next = addDays(m.day, 1).replace(/-/g, "");
            lines.push("BEGIN:VEVENT", `UID:mark-${m.id}-${m.day}@eschool`, `DTSTAMP:${stamp(Date.now())}`, `DTSTART;VALUE=DATE:${m.day.replace(/-/g, "")}`, `DTEND;VALUE=DATE:${next}`, fold(`SUMMARY:★ ${txt(m.label)}`), "TRANSP:TRANSPARENT", "END:VEVENT");
        });
        lines.push("END:VCALENDAR");
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([lines.join("\r\n")], { type: "text/calendar" }));
        a.download = `eschool-schedule-${TODAY}.ics`; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        note(`Saved ${d.items.length + d.marks.length} item${d.items.length + d.marks.length === 1 ? "" : "s"} for the next 60 days. Open the file to add them to Google Calendar, Outlook or your phone’s calendar.`, "ok");
    } catch (e) { note("Couldn’t make the calendar file: " + e.message, "bad"); }
    btn.disabled = false;
}

    $("summary").innerHTML = row("Goals reached", `${o.reached || 0} of ${o.finished || 0}`) + row("Success rate", o.hit_rate == null ? "–" : o.hit_rate + "%")
        + row("How far you get, on average", o.avg_reach == null ? "–" : o.avg_reach + "%") + row("Reached in a row", o.streak || 0)
        + row("Milestones reached", o.milestones_total ? `${o.milestones_hit} of ${o.milestones_total}` : "–")
        + row("Strongest kind of goal", o.best_type ? `${o.best_type.label} (${o.best_type.rate}%)` : "–");
}
function drawHabits() {
    const h = goals.habits || {}, d = h.by_day || [0, 0, 0, 0, 0, 0, 0], max = Math.max(1, ...d), top = d.indexOf(Math.max(...d));
    const parts = [["morning", "Morning"], ["afternoon", "Afternoon"], ["evening", "Evening"], ["night", "Night"]], bp = h.by_part || {};
    const topPart = parts.reduce((a, p) => (bp[p[0]] || 0) > (bp[a] || 0) ? p[0] : a, "morning");
    $("habits").innerHTML = `<div class="hab-bars" aria-label="Tests and quizzes passed by day">${d.map((v, i) => `<div title="${v} on ${DOW[i]}"><span class="${h.total >= 5 && i === top ? "top" : ""}" style="height:${Math.round(v / max * 100)}%"></span><small>${DOW[i].slice(0, 2)}</small></div>`).join("")}</div>
        <div class="hab-parts">${parts.map(p => `<div class="${h.total >= 5 && p[0] === topPart ? "top" : ""}"><b>${bp[p[0]] || 0}</b><small>${p[1]}</small></div>`).join("")}</div>
        <p class="sc-muted" style="margin-top:10px">${esc(h.text || "")}</p>`;
}

/* goal details: chart, milestones, numbers */
function chartSVG(h) {
    const W = 460, H = 190, L = 40, R = 12, T = 12, B = 26;
    const start = h.days[0], total = Math.max(2, Math.round((Date.parse(h.due + "T12:00:00Z") - Date.parse(start + "T12:00:00Z")) / 864e5) + 1);
    const vals = h.actual.filter(v => v != null), maxY = Math.max(1, h.target, ...vals) * 1.1;
    const X = i => L + (W - L - R) * i / (total - 1), Y = v => T + (H - T - B) * (1 - v / maxY);
    const ideal = h.kind === "average" ? `M${X(0)},${Y(h.target)} L${X(total - 1)},${Y(h.target)}` : `M${X(0)},${Y(h.ideal[0])} L${X(total - 1)},${Y(h.target)}`;
    let path = "", started = false;
    h.actual.forEach((v, i) => { if (v == null) return; path += `${started ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)} `; started = true; });
    const last = h.actual.length - 1, lv = h.actual[last];
    const grid = [0, .5, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${Y(maxY / 1.1 * f)}" y2="${Y(maxY / 1.1 * f)}" stroke="currentColor" opacity=".12"/><text x="${L - 6}" y="${Y(maxY / 1.1 * f) + 4}" text-anchor="end" font-size="10" fill="currentColor" opacity=".6">${Math.round(maxY / 1.1 * f)}</text>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Your progress compared with the steady pace">${grid}
        <path d="${ideal}" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
        <path d="${path}" fill="none" stroke="var(--sc-accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
        ${lv != null ? `<circle cx="${X(last)}" cy="${Y(lv)}" r="4.5" fill="var(--sc-accent)"/>` : ""}
        <text x="${L}" y="${H - 6}" font-size="10" fill="currentColor" opacity=".6">${esc(shortDay(start))}</text>
        <text x="${W - R}" y="${H - 6}" font-size="10" text-anchor="end" fill="currentColor" opacity=".6">${esc(shortDay(h.due))}</text></svg>
        <div class="gd-legend"><span><i style="background:var(--sc-accent)"></i>You</span><span><i style="background:#94a3b8"></i>${h.kind === "average" ? "Your target" : "Steady pace to reach it"}</span></div>`;
}

async function saveGoal() {
    const form = $("goalForm"), editing = form.dataset.editingId, msg = $("drMsg"), btn = $("gSave");
    const body = {
        due: $("gDue").value, why: $("gWhy").value.trim(), reward: $("gReward").value.trim(), plan_id: $("gPlan").value,
        priority: (form.querySelector("[data-pri][aria-pressed='true']") || {}).dataset?.pri || "medium",
        study_days: [...form.querySelectorAll("[data-dow][aria-pressed='true']")].map(b => Number(b.dataset.dow)),

        milestones: [...form.querySelectorAll("[data-msrow]")].map(r => ({ pct: Number(r.querySelector("[data-mspct]").value), day: r.querySelector("[data-msday]").value })).filter(m => m.pct || m.day)

    if (!editing) Object.assign(body, { type: $("gType").value, target: Number($("gTarget").value), course: $("gCourse").value });

    try {

        closeDrawer(); gtab = "active"; await Promise.all([loadGoals(), load(true)]);
        note(editing ? "Goal updated." : "Goal set. Eschool will track it, and your study time is on the schedule.", "ok");
    } catch (e) { btn.disabled = false; msg.className = "msg bad"; msg.textContent = e.message; showErrors(e.errors || {}); }
}
async function removeGoal(btn) {

        btn.dataset.sure = "1"; btn.classList.add("sure"); const old = btn.innerHTML; btn.textContent = btn.dataset.active ? "Remove?" : "Clear?";

    }
    btn.disabled = true;
    try { await send(`/api/learner/goals/${btn.dataset.goalrm}`, "DELETE"); await Promise.all([loadGoals(), load(true)]); }

/* ---------- events ---------- */
function go(delta) {
    const step = view === "day" ? 1 : view === "week" ? 7 : 30;
    sel = addDays(sel, delta * step); miniMonth = sel.slice(0, 7); load();
}
$("todayBtn").addEventListener("click", () => { sel = TODAY; miniMonth = TODAY.slice(0, 7); load(); });
$("prevBtn").addEventListener("click", () => go(-1));
$("nextBtn").addEventListener("click", () => go(1));
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => { view = b.dataset.view; try { localStorage.setItem("sc.view", view); } catch (e) {} draw(); }));
$("newBtn").addEventListener("click", () => showEditor(null));
$("markBtn").addEventListener("click", () => showMarkForm(sel));
$("icsBtn").addEventListener("click", exportIcs);
$("printBtn").addEventListener("click", () => window.print());

root.addEventListener("change", e => {
    const s = e.target.closest("[data-show]");
    if (s) { show[s.dataset.show] = s.checked; try { localStorage.setItem("sc.show", JSON.stringify(show)); } catch (x) {} draw(); }
});
root.addEventListener("click", e => {
    const t = e.target;
    const o = t.closest("[data-open]"); if (o) { const x = findItem(o.dataset.open); if (x) showDetails(x); return; }
    const dd = t.closest("[data-day]"); if (dd && !t.closest("[data-st]")) { sel = dd.dataset.day; miniMonth = sel.slice(0, 7); load(); return; }
    const gd = t.closest("[data-goday]"); if (gd) { sel = gd.dataset.goday; view = "day"; draw(); return; }
    if (t.closest("[data-new]")) { showEditor(null); return; }
    if (t.closest("[data-goalnew]")) { showGoalForm(null); return; }
    const gr = t.closest("[data-goalrm]"); if (gr) { removeGoal(gr); return; }
    const go1 = t.closest("[data-goal]"); if (go1) { openGoal(go1.dataset.goal); return; }
    const ge = t.closest("[data-goaledit]"); if (ge) { showGoalForm((goals.goals || []).find(g => g.id === Number(ge.dataset.goaledit))); return; }
    const gt = t.closest("[data-gtab]"); if (gt) { gtab = gt.dataset.gtab; drawGoals(); return; }
    const pl = t.closest("[data-plan]"); if (pl) { plan = pl.dataset.plan; try { localStorage.setItem("sc.plan", plan); } catch (e) {} draw(); return; }
    if (t.closest("[data-plannew]")) { showPlanForm(null); return; }
    const pe = t.closest("[data-planedit]"); if (pe) { showPlanForm((data.plans || []).find(p => p.id === Number(pe.dataset.planedit))); return; }
    const pd = t.closest("[data-plandel]"); if (pd) { deletePlan(pd); return; }
    const st = t.closest("[data-st]"); if (st) { st.disabled = true; setStatus(Number(st.dataset.ev), st.dataset.day, st.dataset.st); return; }
    const um = t.closest("[data-unmark]"); if (um) { unmark(um); return; }
    const col = t.closest("[data-col]");
    if (col && !t.closest(".sc-ev")) {
        const day = col.dataset.col; if (day < TODAY) return;
        const H = hourPx();
        const y = e.clientY - col.getBoundingClientRect().top, mins = Number(col.dataset.min) * 60 + Math.floor(y / H * 60 / 15) * 15;
        if (day === TODAY && mins < nb(Date.now()).min) { note("That time has already passed today. Pick a later time.", "info"); return; }
        showEditor(null, { day, time: hm(Math.min(mins, 23 * 60 + 45)) });
    }
});
drawer.addEventListener("click", e => {
    const t = e.target;
    if (t.closest("[data-close]")) return tryCloseDrawer();
    if (t.closest("#fSave")) return saveEvent();
    if (t.closest("#mSave")) return saveMark();
    if (t.closest("#gSave")) return saveGoal();
    if (t.closest("#pSave")) return savePlan();
    const ge = t.closest("[data-goaledit]"); if (ge) return showGoalForm((goals.goals || []).find(g => g.id === Number(ge.dataset.goaledit)));
    const dw = t.closest("[data-dow]"); if (dw) { dw.setAttribute("aria-pressed", String(dw.getAttribute("aria-pressed") !== "true")); return; }
    const pr = t.closest("[data-pri]"); if (pr) { panel.querySelectorAll("[data-pri]").forEach(b => b.setAttribute("aria-pressed", String(b === pr))); return; }
    if (t.closest("[data-msadd]")) { if ($("msList").children.length < 4) $("msList").insertAdjacentHTML("beforeend", msRow(null, $("gDue").value)); return; }
    if (t.closest("[data-mssuggest]")) return suggestMilestones();
    const md = t.closest("[data-msdel]"); if (md) { md.closest("[data-msrow]").remove(); return; }
    const um = t.closest("[data-unmark]"); if (um) return unmark(um);
    const dur = t.closest("[data-dur]"); if (dur) { $("fMin").value = dur.dataset.dur; updateEnds(); return; }
    const ss = t.closest("[data-setst]"); if (ss && current) { ss.disabled = true; return setStatus(current.id, current._day, ss.dataset.setst, $("drMsg")); }
    if (t.closest("[data-edit]") && current) return showEditor(current);
    if (t.closest("[data-delask]") && current) {
        const rep = current.repeat && current.repeat !== "none";
        $("delBox").innerHTML = `<div class="sc-del"><b>${rep ? "This event repeats. Delete which?" : "Delete this event? This can’t be undone."}</b><div class="btns">
            ${rep ? `<button type="button" class="sc-btn danger" data-del="one">Only ${esc(shortDay(current._day))}</button><button type="button" class="sc-btn sure" data-del="all">Every day</button>` : '<button type="button" class="sc-btn sure" data-del="all">Delete</button>'}
            <button type="button" class="sc-btn ghost" data-delno>Keep it</button></div></div>`;
        $("delBox").scrollIntoView({ block: "nearest" });
        return;
    }
    if (t.closest("[data-delno]")) { $("delBox").innerHTML = ""; return; }
    const del = t.closest("[data-del]");
    if (del && current) {
        del.disabled = true;
        const title = current.title;
        send(`/api/teacher/events/${current.id}?scope=${del.dataset.del}&day=${current._day}`, "DELETE")
            .then(async d => { closeDrawer(); await load(true); note(d.message || `“${title}” deleted.`, "ok"); })
            .catch(err => { del.disabled = false; $("drMsg").className = "msg bad"; $("drMsg").textContent = err.message; });
    }
});
drawer.addEventListener("input", e => {
    if (e.target.closest("form, .sc-form")) drawerDirty = true;
    const f = e.target.closest(".sc-f.err"); if (f) { f.classList.remove("err"); const er = f.querySelector(".sc-ferr"); if (er) er.textContent = ""; }
    if (["fMin", "fTime", "fDay"].includes(e.target.id)) updateEnds();
    if (e.target.id === "mDay") existingMarks();
    if (e.target.id === "gDue") panel.querySelectorAll("[data-msday]").forEach(i => { i.max = e.target.value; });
});
drawer.addEventListener("change", e => {
    if (e.target.id === "fRep") { $("untilWrap").hidden = e.target.value === "none"; updateEnds(); }
    if (e.target.name === "fKind") updateEnds();
    if (e.target.id === "gType") goalTypeChanged(true);
});
document.addEventListener("keydown", e => {
    if (e.key === "Escape" && drawer.classList.contains("show")) tryCloseDrawer();
    if (e.key === "Tab" && drawer.classList.contains("show")) {
        const f = [...panel.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select, textarea')].filter(el => el.offsetParent !== null);
        if (f.length) {
            if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
            else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
        }
    }
    if (e.key === "Enter" && drawer.classList.contains("show") && e.target.matches("#evForm input")) { e.preventDefault(); saveEvent(); }
    if (e.key === "Enter" && drawer.classList.contains("show") && e.target.id === "pName") { e.preventDefault(); savePlan(); }
});

/* ---------- move what the old page kept in this browser into the account (once) ---------- */
async function importOld() {
    const email = root.dataset.email || "default_user";
    const keys = [`scheduleData_${email}`, `dayMarks_${email}`];
    let events = [], marks = [];
    try { events = JSON.parse(localStorage.getItem(keys[0]) || "[]"); marks = JSON.parse(localStorage.getItem(keys[1]) || "[]"); } catch (e) { return; }
    if (!Array.isArray(events)) events = []; if (!Array.isArray(marks)) marks = [];
    if (!events.length && !marks.length) return;
    try {
        const d = await send("/api/teacher/schedule/import", "POST", { events, marks });
        keys.forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
        if (d.events || d.marks) { await load(true); note(`Moved ${d.events} event${d.events === 1 ? "" : "s"} and ${d.marks} marked day${d.marks === 1 ? "" : "s"} from this browser into your account, so they now show on every device.`, "ok"); }
    } catch (e) { /* try again next time */ }
}

load().then(() => { importOld(); loadGoals(); });
const refresh = () => { TODAY = nb(Date.now()).day; if (!drawer.classList.contains("show")) { load(true); loadGoals(); } };
setInterval(() => { if (!document.hidden) refresh(); }, 120000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
